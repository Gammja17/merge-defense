function resize() {
  const cs = getComputedStyle(document.documentElement);
  const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  scale = Math.min(innerWidth / W, (innerHeight - padY) / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', resize);

  return Promise.all(IMG_NAMES.map(n => new Promise(res => {
    const im = new Image();

    im.src = 'assets/' + n + '.png';

  })));
}
// 기존 스프라이트에 색을 입혀 새 적과 전함을 만든다
function makeTint(src, color, key, amount = 0.5, flip = false) {
  const im = IMG[src];
  if (!im || !im.width) return;
  IMG[key] = offscreen(im.width, im.height, g => {
    if (flip) { g.translate(im.width, im.height); g.rotate(Math.PI); }
    g.drawImage(im, 0, 0);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = amount; g.fillStyle = color; g.fillRect(0, 0, im.width, im.height);
  });
}
function buildTints() {
  makeTint('e_grunt', '#ff3cc8', 't_sniper', 0.55);
  makeTint('e_tank', '#ff2a3a', 't_gunship', 0.5);
  makeTint('e_rusher', '#ffa020', 't_bomber', 0.45);
  makeTint('b_flag', '#4ab8ff', 'u_bship', 0.4, true);
}

function loadSfx() {
  if (SFX.zap) return;
  for (const n of ['laser1','zap','twoTone','shieldDown','shieldUp','lose']) {
    const a = new Audio('assets/sfx/' + n + '.ogg');
    a.preload = 'auto';
    SFX[n] = a;
  }
}
function play(n, vol = 0.4) {
  const src = SFX[n];
  if (!src) return;
  const a = src.cloneNode();
  a.volume = vol;
  a.play().catch(() => {});
}
function spr(name, x, y, w, h, rot = 0, alpha = 1) {
  const im = IMG[name];
  if (!im || !im.width) return;
  if (w == null) { w = im.width; h = im.height; }
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

function stageInfo(n) {
  const s = Math.floor((n - 1) / 5), i = (n - 1) % 5;
  return { n, s, i, sector: SECTORS[s], boss: i === 4, waves: 3 };

let START_ARMY = [['f1', 'f1', 'f1'], ['f2', 'f1', 'f1', 't1'], ['f2', 'f2', 't2', 't1'], ['f3', 'f2', 't2', 't2']];

function pickWeighted(pool, fresh) {
  const bag = [];
  for (const k of pool) { bag.push(k); if (fresh.includes(k)) bag.push(k, k); }
  return bag[Math.floor(Math.random() * bag.length)];
}
function pickReward(n, w, avoid) {
  const r = Math.random() + 0.035 * (n - 1) + 0.12 * (w - 1);
  const tier = REWARD_TIER[r < 0.55 ? 0 : r < 1.05 ? 1 : 2];
  let k, guard = 0;
  do { k = tier[Math.floor(Math.random() * tier.length)]; } while (k === avoid && guard++ < 10);
  return k;
}
function buildWave(st, w) {
  const ev = [];
  const bossWave = st.boss && w === st.waves;
  const dur = bossWave ? 50 : 22;
  const gap = bossWave ? 3.2 : Math.max(0.8, 1.6 - 0.15 * (w - 1) - 0.05 * st.i);
  for (let t = 1; t < dur; t += gap) ev.push({ t, k: 'grunt' });
  let pool = st.sector.pool;
  if (st.n === 1) pool = w === 2 ? ['tank'] : ['tank', 'rocks'];
  const count = st.n === 1 ? w - 1 : (bossWave ? 1 + Math.min(st.s, 2) : w + Math.floor(st.i / 2) + Math.min(st.s, 2));
  for (let k = 0; k < count; k++) {
    let type = pickWeighted(pool, st.sector.fresh);
    if (k === 0 && st.i === 0 && st.sector.fresh.length) type = st.sector.fresh[(w - 1) % st.sector.fresh.length];
    ev.push({ t: 3 + (k + 0.5) * (dur - 6) / count, k: type });
  }
  // 공격형 적 (1스테이지는 없음)
  if (st.n >= 2 && !bossWave) {
    const atkN = Math.min(3, (w >= 2 ? 1 : 0) + (st.i >= 2 ? 1 : 0) + (st.s >= 2 ? 1 : 0) + (st.n === 2 && w === 1 ? 1 : 0));
    for (let k = 0; k < atkN; k++) {
      const pool2 = st.sector.atk;
      const type = k === 0 && st.i === 0 ? pool2[pool2.length - 1] : pool2[Math.floor(Math.random() * pool2.length)];
      ev.push({ t: 4 + (k + 0.3) * (dur - 8) / Math.max(1, atkN), k: type });
    }
  }
  if (bossWave) ev.push({ t: 1.5, k: st.sector.boss });
  const capT = bossWave ? [6, 14, 24, 32, 40] : [3, 9, 15, 21];
  capT.forEach((t, k) => {
    const a = pickReward(st.n, w);
    ev.push({ t, k: 'cap', r: k % 2 ? [a, pickReward(st.n, w, a)] : a });
  });
  return ev.sort((a, b) => a.t - b.t);
}

// ── 게임 상태 ─────────────────────────────────────────────
let S = { mode: 'title' };
let BUTTONS = [];
function startStage(n) {
  const st = stageInfo(n);
  S = {
    mode: 'play', stage: st,
    wave: 0, waveT: 0, events: [], breakT: 0,
    hp: 10, maxHp: 10,
    slots: new Array(COLS * ROWS).fill(null),
    reserve: new Array(RES_N).fill(null),
    enemies: [], caps: [], shots: [], fx: [], texts: [],
    zones: [], strikes: [], beams: [], attacks: [],
    focus: null, boss: null,
    hint: null, hintT: 0, hintQueue: [],
    shake: 0, time: 0, glitch: 0, lost: 0,
    parts: [], shieldHits: [], banner: null, warning: 0, whiteFlash: 0, skillPop: null,
  };
  START_ARMY[st.s].forEach((k, j) => place(makeUnit(k[0], +k[1]), [START_CELLS[j]]));
  hintOnce('focus', '캡슐을 탭하면 모든 기체가 그쪽을 집중 사격해요. 그동안 적은 막지 못해요!');
  startWave(1);
}
function makeUnit(type, lv) {
  const hp = unitMaxHp(type, lv);
  return { type, lv, hp, maxHp: hp, size: UNIT[type].size, cells: null, res: null,
           cd: Math.random() * 0.3, sk: 2, ang: -Math.PI / 2, pop: 0.4, hurt: 0 };
}

function startWave(n) {
  const st = S.stage;
  S.wave = n; S.waveT = 0; S.events = buildWave(st, n); S.mode = 'play';
  if (st.boss && n === st.waves) { S.warning = 3; S.banner = null; }
  else if (n === 1) S.banner = { text: `STAGE ${st.n}`, sub: `${st.sector.name} · 웨이브 1/${st.waves}`, color: st.sector.color, t: 0, life: 2.2 };
  else S.banner = { text: `WAVE ${n}`, sub: n === st.waves ? '마지막 웨이브' : `웨이브 ${n}/${st.waves}`, color: '#ffd966', t: 0, life: 2.2 };

function drawEnemy(e) {

  if (focused || e.pending > 0) {
    const bs = e.r * (focused ? 1.5 : 1.25) + Math.sin(S.time * 10) * 2;
    brackets(e.x - bs, e.y - bs, bs * 2, bs * 2, bs * 0.4, focused ? '#ff4d5a' : 'rgba(120,230,255,.55)', focused ? 3 : 1.5);
  }
  if (!e.boss && (e.hp < e.maxHp || e.shield < e.maxShield)) {
    const bw = e.w * 0.8, bx = e.x - bw / 2, by = e.y - e.h / 2 - 12;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    ctx.fillStyle = '#ff5a5a'; ctx.fillRect(bx, by, bw * Math.max(0, e.hp / e.maxHp), 4);
    if (e.maxShield) { ctx.fillStyle = '#6ad0ff'; ctx.fillRect(bx, by - 4, bw * Math.max(0, e.shield / e.maxShield), 2); }
  }
  if (ENEMY[e.k].atk && !e.boss) {
    ctx.font = FU(10); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = charging ? '#ff6a7a' : 'rgba(255,150,200,.7)';
    ctx.fillText(charging ? '▲ LOCK' : ENEMY[e.k].name, e.x, e.y + e.h / 2 + 10);
  }
}

// 경고 중인 칸
function drawAttacks() {
  for (const a of S.attacks) {
    const p = Math.min(1, a.t / a.warn), pulse = 0.5 + 0.5 * Math.sin(S.time * (10 + p * 20));
    const m = cellsCenter(a.cells);
    if (a.src) {
      ctx.strokeStyle = `rgba(255,60,90,${0.3 + 0.4 * p})`; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
      ctx.lineDashOffset = -S.time * 40;
      ctx.beginPath(); ctx.moveTo(a.src.x, a.src.y); ctx.lineTo(m.x, m.y); ctx.stroke(); ctx.setLineDash([]);
    }
    for (const c of a.cells) {
      const q = cellPos(c), x = q.x - CW / 2 + 3, y = q.y - CH / 2 + 3, w = CW - 6, h = CH - 6;
      ctx.fillStyle = `rgba(255,30,60,${0.12 + 0.2 * pulse * (0.5 + p)})`;
      chamfer(x, y, w, h, 8); ctx.fill();
      ctx.save(); chamfer(x, y, w, h, 8); ctx.clip();
      ctx.fillStyle = `rgba(255,60,80,${0.18 + 0.12 * p})`;
      const o = (S.time * 50) % 18;
      for (let sx = x - h + o; sx < x + w; sx += 18) { ctx.beginPath(); ctx.moveTo(sx, y + h); ctx.lineTo(sx + h, y); ctx.lineTo(sx + h + 7, y); ctx.lineTo(sx + 7, y + h); ctx.fill(); }
      ctx.restore();
      ctx.strokeStyle = `rgba(255,80,100,${0.5 + 0.5 * pulse})`; ctx.lineWidth = 2;
      chamfer(x, y, w, h, 8); ctx.stroke();
      ctx.fillStyle = '#ff4a5a'; ctx.fillRect(x + 6, y + h - 7, (w - 12) * (1 - p), 3);
    }
    if (a.kind === 'meteor') {
      drawGlow('#000000', m.x, m.y, 20 + 70 * p, 0.6, 0.6);
      ctx.fillStyle = `rgba(0,0,0,${0.25 + 0.35 * p})`;
      ctx.beginPath(); ctx.ellipse(m.x, m.y, 20 + 70 * p, (20 + 70 * p) * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      if (p > 0.6) {
        const k = (p - 0.6) / 0.4, my = m.y - 600 * (1 - k);
        drawFlame(m.x, my - 90, 90, 18, '#ff8a3a');
        spr('e_split', m.x, my, 110, 92, S.time * 3);
        drawGlow('#ffb347', m.x, my, 60, 0.7);
      }
    }
    ctx.font = FU(13); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const top = Math.min(...a.cells.map(c => cellPos(c).y)) - CH / 2 - 8;
    ctx.globalAlpha = 0.6 + 0.4 * pulse;
    outlineText(`⚠ INCOMING ${(a.warn - a.t).toFixed(1)}`, m.x, Math.max(top, LINE_Y + 6), '#ff6a7a', 3);
    ctx.globalAlpha = 1;
  }
}

function drawShield() {
  const t = S.time;
  const gr = ctx.createLinearGradient(0, LINE_Y - 56, 0, LINE_Y - 12);
  gr.addColorStop(0, 'rgba(80,200,255,0)');
  gr.addColorStop(1, `rgba(80,200,255,${0.18 + 0.07 * Math.sin(t * 2)})`);
  ctx.fillStyle = gr; ctx.fillRect(0, LINE_Y - 56, W, 44);

  ctx.fillStyle = HEX_PAT; ctx.fillRect(0, LINE_Y - 44, W, 32);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(130,225,255,.85)'; ctx.fillRect(0, LINE_Y - 13, W, 2);
  ctx.restore();
  const sx = ((t * 180) % (W + 300)) - 150;
  drawGlow('#8fe6ff', sx, LINE_Y - 12, 90, 0.55, 0.14);
  for (const h of S.shieldHits) {
    const p = h.t / 0.8;
    drawGlow('#ff3a3a', h.x, LINE_Y - 18, 40 + 100 * p, (1 - p) * 0.95, 0.4);

}

function drawPads() {
  const t = S.time;
  for (let i = 0; i < COLS * ROWS; i++) {
    const p = cellPos(i), x = p.x - CW / 2 + 4, y = p.y - CH / 2 + 4, w = CW - 8, h = CH - 8;
    const front = i < COLS, u = S.slots[i];
    ctx.fillStyle = front ? 'rgba(40,26,10,.55)' : 'rgba(10,20,44,.6)';
    chamfer(x, y, w, h, 9); ctx.fill();
    ctx.strokeStyle = front ? 'rgba(255,180,70,.35)' : 'rgba(80,200,255,.22)'; ctx.lineWidth = 1.2; ctx.stroke();
    brackets(x + 3, y + 3, w - 6, h - 6, 6, front ? 'rgba(255,190,90,.35)' : 'rgba(120,220,255,.25)', 1);
    if (u) {
      const col = TYPE_COL[u.type];
      ctx.strokeStyle = col; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5; ctx.setLineDash([4, 6]); ctx.lineDashOffset = -t * 30;
      ctx.beginPath(); ctx.moveTo(x + 10, y + h - 5); ctx.lineTo(x + w - 10, y + h - 5); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    if (front && !u) {
      ctx.font = FU(9); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,190,90,.55)'; ctx.fillText('ATK +15%', p.x, p.y);
    }
    if (drag && drag.moved) {
      const du = drag.unit, tu = S.slots[i];
      if (tu && tu !== du && tu.type === du.type && tu.lv === du.lv && du.lv < MAX_LV) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 12);
        drawGlow('#8dff9a', p.x, p.y, 50, 0.3 + 0.3 * pulse);
        ctx.strokeStyle = `rgba(141,255,154,${0.5 + 0.5 * pulse})`; ctx.lineWidth = 2.5;
        chamfer(x, y, w, h, 9); ctx.stroke();
      }
    }
  }
  // 대기함
  const rx = RES_X, ry = GRID_Y + 4, rw = RES_W, rh = CH * ROWS - 8;
  ctx.fillStyle = 'rgba(30,10,40,.55)'; chamfer(rx, ry, rw, rh, 9); ctx.fill();
  ctx.strokeStyle = 'rgba(255,90,200,.35)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = FU(9); ctx.fillStyle = 'rgba(255,140,220,.8)'; ctx.fillText('RESERVE', rx + rw / 2, ry + 18);
  ctx.font = FK(15); ctx.fillStyle = '#ffd0f0'; ctx.fillText('대기함', rx + rw / 2, ry + 38);
  ctx.font = FT(11); ctx.fillStyle = 'rgba(255,200,240,.8)';
  ctx.fillText(`${S.reserve.filter(Boolean).length}/${RES_N}`, rx + rw / 2, ry + 58);
  for (let k = 0; k < RES_N; k++) {
    const q = resPos(k);
    ctx.strokeStyle = 'rgba(255,120,220,.3)'; ctx.setLineDash([3, 4]);
    chamfer(q.x - 25, q.y - 34, 50, 68, 7); ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawZones() {
  for (const z of S.zones) {
    const p = z.t / z.life, a = Math.min(1, (1 - p) * 3) * Math.min(1, z.t * 6);
    drawGlow('#ff5a1a', z.x, z.y, z.r * 1.3, 0.45 * a, 0.5);
    for (let k = 0; k < 5; k++) {
      const ox = Math.sin(z.t * 7 + k * 1.7) * z.r * 0.6, fl = 16 + 10 * Math.sin(z.t * 13 + k * 2.3);
      drawFlame(z.x + ox, z.y + 6 - fl, fl, 7, k % 2 ? '#ffb347' : '#ff5a2a', 0.8 * a);
    }
  }
}
function drawStrikes() {
  for (const k of S.strikes) {
    if (k.done) continue;
    const p = k.t / k.delay;
    ctx.save(); ctx.translate(k.x, k.y);
    ctx.strokeStyle = `rgba(255,210,74,${0.4 + 0.6 * p})`; ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]); ctx.lineDashOffset = -S.time * 60;
    ctx.beginPath(); ctx.arc(0, 0, k.r * (1.4 - 0.4 * p), 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.rotate(S.time * 3);
    for (let q = 0; q < 4; q++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(k.r * 0.25, 0); ctx.lineTo(k.r * 0.55, 0); ctx.stroke(); }
    ctx.restore();
    drawGlow('#ffd24a', k.x, k.y, k.r, 0.15 + 0.35 * p, 0.5);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = p * 0.6;
    const gr = ctx.createLinearGradient(0, 0, 0, k.y);
    gr.addColorStop(0, 'rgba(255,230,140,0)'); gr.addColorStop(1, 'rgba(255,230,140,.8)');
    ctx.fillStyle = gr; ctx.fillRect(k.x - 3, 0, 6, k.y);
    ctx.restore();
  }
}
function drawBeams() {
  for (const b of S.beams) {
    const p = b.t / b.life;
    const a = Math.min(1, b.t * 8) * Math.min(1, (1 - p) * 4);
    const len = 1200, wid = 30 * (0.8 + 0.2 * Math.sin(b.t * 40));
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    let gr = ctx.createLinearGradient(0, -wid, 0, wid);
    gr.addColorStop(0, 'rgba(255,190,40,0)'); gr.addColorStop(0.5, 'rgba(255,200,60,.85)'); gr.addColorStop(1, 'rgba(255,190,40,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, -wid, len, wid * 2);
    gr = ctx.createLinearGradient(0, -wid * 0.3, 0, wid * 0.3);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,240,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, -wid * 0.3, len, wid * 0.6);
    for (let k = 0; k < 8; k++) {
      const x = ((b.t * 900 + k * 150) % len);
      ctx.fillStyle = 'rgba(255,245,200,.6)';
      ctx.fillRect(x, -wid * 0.55, 30, wid * 1.1);
    }
    ctx.restore();
    drawGlow('#ffd24a', b.x, b.y, 50, a);
    drawGlow('#ffffff', b.x, b.y, 22, a);
    if (Math.random() < 0.6) sparks(b.x, b.y, '#ffe27a', 1, 200);
  }
}

function drawFx() {
  for (const f of S.fx) {
    if (f.t < 0) continue;
    const p = f.t / f.life;
    if (f.kind === 'hit') {
      drawGlow(f.color || '#7fe0ff', f.x, f.y, 16, 1 - p);
      spr('hit', f.x, f.y, 26, 26, 0, 1 - p);
    } else if (f.kind === 'boom') {
      const r = (22 + 46 * p) * f.size;
      drawGlow(f.color, f.x, f.y, r * 1.4, (1 - p) * 0.9);
      if (p < 0.35) drawGlow('#ffffff', f.x, f.y, r * 0.6, (0.35 - p) * 3);
      spr('puff', f.x, f.y, r * 1.3, r * 1.3, p * 2, (1 - p) * 0.55);
      const rr = (12 + 64 * p) * f.size;
      ctx.lineWidth = 3 * (1 - p) + 0.5;
      ctx.strokeStyle = `rgba(255,60,120,${(1 - p) * 0.45})`; ctx.beginPath(); ctx.arc(f.x - 2, f.y, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(60,230,255,${(1 - p) * 0.45})`; ctx.beginPath(); ctx.arc(f.x + 2, f.y, rr, 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === 'ring') {
      const r = f.grow === -1 ? (f.r0 || 20) * (2 - p) : (f.r0 || 20) + 70 * p;
      ctx.strokeStyle = f.color; ctx.globalAlpha = Math.max(0, 1 - p); ctx.lineWidth = 5 * (1 - p) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.kind === 'pulse') {
      ctx.strokeStyle = f.color; ctx.globalAlpha = (1 - p) * 0.7; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * p, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      drawGlow(f.color, f.x, f.y, f.r * p, (1 - p) * 0.25);
    } else if (f.kind === 'beam') {
      const bw = 80 * (1 - p);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - p;
      const gr = ctx.createLinearGradient(0, f.y - 300, 0, f.y);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, f.color || 'rgba(140,255,160,.7)');
      ctx.fillStyle = gr; ctx.fillRect(f.x - bw / 2, f.y - 300, bw, 300);
      ctx.restore();
    } else if (f.kind === 'scan') {
      // 합체 데이터 스캔 링
      ctx.save(); ctx.translate(f.x, f.y); ctx.globalAlpha = 1 - p;
      ctx.strokeStyle = f.color; ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {
        ctx.rotate(S.time * (k % 2 ? -4 : 5));
        ctx.beginPath(); ctx.arc(0, 0, 30 + k * 12 + p * 20, 0, Math.PI * (0.6 + k * 0.3)); ctx.stroke();
      }
      ctx.restore();
    } else if (f.kind === 'pillar') {
      const bw = 120 * (1 - p * 0.7);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1 - p;
      const gr = ctx.createLinearGradient(f.x - bw / 2, 0, f.x + bw / 2, 0);
      gr.addColorStop(0, 'rgba(255,200,60,0)'); gr.addColorStop(0.5, 'rgba(255,250,220,1)'); gr.addColorStop(1, 'rgba(255,200,60,0)');
      ctx.fillStyle = gr; ctx.fillRect(f.x - bw / 2, 0, bw, f.y);
      ctx.restore();
      ctx.strokeStyle = `rgba(255,230,150,${1 - p})`; ctx.lineWidth = 6 * (1 - p) + 1;
      ctx.beginPath(); ctx.ellipse(f.x, f.y, 40 + 180 * p, (40 + 180 * p) * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === 'fly') {
      const e = p * p * (3 - 2 * p);
      const x = f.x + (f.tx - f.x) * e, y = f.y + (f.ty - f.y) * e - Math.sin(p * Math.PI) * 60;
      drawGlow(f.color, x, y, 20, 1 - p * 0.5);
      drawGlow('#ffffff', x, y, 8, 1);
      if (p > 0.9) drawGlow(f.color, f.tx, f.ty, 50, (1 - p) * 8);
    } else if (f.kind === 'atk') {
      drawAtkFx(f, p);
    }
  }
}
function drawAtkFx(f, p) {
  const a = 1 - p;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const beamV = (x, y0, y1, w) => {
    const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(0.5, `rgba(255,220,230,${a})`); g.addColorStop(1, 'rgba(255,40,70,0)');
    ctx.fillStyle = g; ctx.fillRect(x - w, y0, w * 2, y1 - y0);
  };
  const beamH = (y, w) => {
    const g = ctx.createLinearGradient(0, y - w, 0, y + w);
    g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(0.5, `rgba(255,220,230,${a})`); g.addColorStop(1, 'rgba(255,40,70,0)');
    ctx.fillStyle = g; ctx.fillRect(0, y - w, W, w * 2);
  };
  if (f.atk === 'snipe' && f.src) {
    const q = cellPos(f.cells[0]);
    ctx.strokeStyle = `rgba(255,90,200,${a})`; ctx.lineWidth = 8 * a + 1;
    ctx.beginPath(); ctx.moveTo(f.src.x, f.src.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(f.src.x, f.src.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  } else if (f.atk === 'column') {
    const q = cellPos(f.cells[0]);
    beamV(q.x, f.src ? f.src.y : 0, H, 34 * (1 - p * 0.6));
  } else if (f.atk === 'row') {
    beamH(cellPos(f.cells[0]).y, 34 * (1 - p * 0.6));
  } else if (f.atk === 'cross') {
    const rows = new Set(f.cells.map(c => Math.floor(c / COLS))), cols = new Set(f.cells.map(c => c % COLS));
    const r = [...rows].find(r => f.cells.filter(c => Math.floor(c / COLS) === r).length === COLS);
    const c = [...cols].find(c => f.cells.filter(x => x % COLS === c).length === ROWS);
    if (r != null) beamH(cellPos(r * COLS).y, 30 * (1 - p * 0.6));
    if (c != null) beamV(cellPos(c).x, f.src ? f.src.y : 0, H, 30 * (1 - p * 0.6));
  }
  ctx.restore();
}

function drawParts() {
  ctx.fillStyle = '#9aa0b8';
  for (const p of S.parts) if (p.kind === 'smoke') {
    const k = 1 - p.t / p.life;
    ctx.globalAlpha = k * 0.3;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - k), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const p of S.parts) {
    const k = 1 - p.t / p.life;
    if (p.kind === 'spark') {
      ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = p.size * k + 0.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.045, p.y - p.vy * 0.045); ctx.stroke();
    } else if (p.kind === 'shard') {
      ctx.globalAlpha = k; ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.t * 10);
      ctx.beginPath(); ctx.moveTo(0, -p.size * 2.2); ctx.lineTo(p.size, p.size); ctx.lineTo(-p.size, p.size); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawShots() {
  for (const s of S.shots) {
    const a = Math.atan2(s.vy, s.vx) + Math.PI / 2;
    const sp = Math.hypot(s.vx, s.vy) || 1, ux = s.vx / sp, uy = s.vy / sp;
    if (s.type === 'f') {
      const col = LV_COL[s.lv - 1], tl = 46;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const tg = ctx.createLinearGradient(s.x - ux * tl, s.y - uy * tl, s.x, s.y);
      tg.addColorStop(0, 'rgba(80,200,255,0)'); tg.addColorStop(1, 'rgba(80,200,255,.55)');
      ctx.strokeStyle = tg; ctx.lineWidth = 3 + s.lv * 0.7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x - ux * tl, s.y - uy * tl); ctx.lineTo(s.x, s.y); ctx.stroke();
      ctx.restore();
      drawGlow(col, s.x, s.y, 12 + s.lv * 2, 0.55);
      spr('laser', s.x, s.y, 7 + s.lv, 34, a);
    } else if (s.type === 'p') {
      const tl = 90;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      let tg = ctx.createLinearGradient(s.x - ux * tl, s.y - uy * tl, s.x, s.y);
      tg.addColorStop(0, 'rgba(170,90,255,0)'); tg.addColorStop(1, 'rgba(190,120,255,.9)');
      ctx.strokeStyle = tg; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(s.x - ux * tl, s.y - uy * tl); ctx.lineTo(s.x, s.y); ctx.stroke();
      tg = ctx.createLinearGradient(s.x - ux * tl, s.y - uy * tl, s.x, s.y);
      tg.addColorStop(0, 'rgba(255,255,255,0)'); tg.addColorStop(1, 'rgba(255,245,255,1)');
      ctx.strokeStyle = tg; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(s.x - ux * tl * 0.8, s.y - uy * tl * 0.8); ctx.lineTo(s.x, s.y); ctx.stroke();
      ctx.restore();
      drawGlow('#b86bff', s.x, s.y, 26, 0.8);
    } else if (s.type === 'bomb') {
      drawGlow('#ffcf5a', s.x, s.y, 12, 0.8);
      spr('bomblet', s.x, s.y, 12, 17, a);
    } else if (s.type === 'b') {
      drawGlow('#7fe8ff', s.x, s.y, 20, 0.8);
      drawGlow('#ffffff', s.x, s.y, 7, 1);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = 'rgba(127,232,255,.5)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x - ux * 30, s.y - uy * 30); ctx.lineTo(s.x, s.y); ctx.stroke(); ctx.restore();
    } else if (s.type === 'plasma') {
      const r = 22 + Math.sin(S.time * 30) * 3;
      drawGlow('#7fe8ff', s.x, s.y, r * 2.4, 0.9);
      drawGlow('#ffffff', s.x, s.y, r * 0.8, 1);

      ctx.fillRect(p.x + p.r * 0.35, p.y - p.r - 2, 12, 10);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x + p.r * 0.35 + 6, p.y - p.r - 2, 4, Math.PI, 0); ctx.stroke();
    }
    for (let k = 0; k < 3; k++) drawStar(p.x + (k - 1) * 13, p.y + p.r + 12, 5.5, k < stars ? '#ffd24a' : 'rgba(255,255,255,.14)');
    BUTTONS.push({ x: p.x - p.r - 8, y: p.y - p.r - 8, w: p.r * 2 + 16, h: p.r * 2 + 24, act: 'stage', n });
  }

  if (S.toast) {
    const k = S.toast, a = Math.min(1, (k.until - t) * 2);
    if (a > 0) {
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(4,12,34,.94)'; chamfer(70, 918, W - 140, 32, 10); ctx.fill();
      ctx.font = FK(16); ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.fillText(k.text, W / 2, 935);
      ctx.globalAlpha = 1;
    }
  }
}

function drawTitle() {
  const t = performance.now() / 1000;
  for (let k = 0; k < 3; k++) {
    const ph = (t * 0.18 + k / 3) % 1;
    const x = [100, 270, 440][k] + Math.sin(t + k) * 10, y = H + 60 - ph * (H + 160);
    drawFlame(x, y + 18, 26, 6, LV_COL[k + 2], 0.6);
    spr('f' + (k + 1), x, y, 60, 46, 0, 0.55);
  }
  drawGlow('#ff3a2a', W / 2, 170, 150, 0.22 + 0.1 * Math.sin(t * 2));
  const by = 190 + Math.sin(t * 1.2) * 8;
  for (const ox of [-58, 58]) drawGlow('#ff6a3a', W / 2 + ox, by - 88, 24, 0.7, 1.4);
  spr('e_boss', W / 2, by, 224, 196);
  brackets(W / 2 - 130, by - 110, 260, 220, 22, 'rgba(255,90,90,.5)', 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  drawGlow('#48c8ff', W / 2, 385, 220, 0.25, 0.4);
  const amt = Math.random() < 0.06 ? 4 + Math.random() * 6 : 0.4;
  ctx.save();
  ctx.shadowColor = '#48c8ff'; ctx.shadowBlur = 20;
  ctx.font = FT(64, 900); glitchText('MERGE', W / 2, 352, '#d8f6ff', 7, amt);
  ctx.font = FT(38, 900); glitchText('DEFENSE', W / 2, 408, '#48c8ff', 6, amt);
  ctx.restore();
  ctx.font = FU(11); ctx.fillStyle = 'rgba(140,220,255,.7)';
  ctx.fillText('// ORBITAL DEFENSE PROGRAM v0.4', W / 2, 442);

  ctx.font = FK(18);
  const lines = [
    '외계 함대가 기지로 내려옵니다. 기체들은 알아서 쏴요.',
    '캡슐을 탭하면 집중 사격! 깨면 새 기체가 와요.',
    '같은 기체 둘을 겹치면 합체, 레벨마다 새 스킬.',
    '붉게 표시된 칸은 곧 공격받아요. 끌어서 피하세요.',
  ];
  lines.forEach((l, k) => outlineText(l, W / 2, 486 + k * 30, '#e6ecff', 4));

  const cyc = (t % 2.4) / 2.4, cy = 700;
  if (cyc < 0.55) {
    const k = cyc / 0.55, gap = 70 * (1 - k * k);
    for (const sx of [-1, 1]) { drawFlame(W / 2 + sx * gap, cy + 14, 16, 5, '#48c8ff'); spr('f2', W / 2 + sx * gap, cy, 66, 48); }
  } else {
    const k = (cyc - 0.55) / 0.45;
    if (k < 0.3) drawGlow('#5ae0ff', W / 2, cy, 90, (0.3 - k) * 3);
    drawGlow('#5ae0ff', W / 2, cy + 6, 60, 0.25);
    drawFlame(W / 2, cy + 18, 24, 7, '#5ae0ff');
    const sc = 1 + Math.max(0, 0.25 - k) * 1.5;
    spr('f3', W / 2, cy, 76 * sc, 57 * sc);
    ctx.font = FK(17); glitchText('확산 레이저!', W / 2, cy - 50, '#5ae0ff', 4, k < 0.2 ? 6 : 0);
  }

  ctx.font = FT(20, 900);
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 4);
  outlineText('TAP TO START', W / 2, 850, '#ffd966', 4);
  ctx.font = FK(15); ctx.fillStyle = 'rgba(255,230,160,.8)'; ctx.fillText('탭해서 시작', W / 2, 878);
  ctx.globalAlpha = 1;
}

// ── 입력 ──────────────────────────────────────────────────
let drag = null;
function toLocal(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / scale, y: (ev.clientY - r.top) / scale };
}
function hitButton(p) {
  return BUTTONS.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
}
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const p = toLocal(ev);
  loadSfx();
  if (S.mode === 'title') { S = { mode: 'map' }; return; }
  if (S.mode === 'map') {
    const b = hitButton(p);
    if (b && b.act === 'stage') {
      if (unlocked(b.n)) startStage(b.n);
      else S.toast = { text: '앞 스테이지를 먼저 깨야 열려요', until: performance.now() / 1000 + 1.6 };
    }
    return;
  }
  if (S.mode === 'win' || S.mode === 'lose') {
    const b = hitButton(p);
    if (!b) return;
    if (b.act === 'next') startStage(S.stage.n + 1);
    else if (b.act === 'retry') startStage(S.stage.n);
    else if (b.act === 'map') S = { mode: 'map' };
    return;
  }
  const c = cellAt(p.x, p.y), k = resAt(p.x, p.y);
  const u = c >= 0 ? S.slots[c] : k >= 0 ? S.reserve[k] : null;
  if (u) {
    drag = { unit: u, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false, id: ev.pointerId };
    cv.setPointerCapture(ev.pointerId);
    return;
  }
  // 캡슐이나 적을 탭하면 집중 사격 (다시 탭하면 해제)
  let best = null, bd = 1e9;
  for (const cp of S.caps) { const d = Math.hypot(cp.x - p.x, cp.y - p.y); if (d < 60 && d < bd) { bd = d; best = cp; } }
  for (const e of S.enemies) { const d = Math.hypot(e.x - p.x, e.y - p.y); if (d < e.r + 22 && d < bd) { bd = d; best = e; } }
  if (best) S.focus = S.focus === best ? null : best;
});
cv.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  const p = toLocal(ev);
  drag.x = p.x; drag.y = p.y;
  if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 8) drag.moved = true;
});
function doMerge(target, from) {
  mergeInto(target, from);
  const q = unitPos(target), col = LV_COL[target.lv - 1];
  boom(q.x, q.y, 1 + target.lv * 0.15, col);
  S.fx.push({ kind: 'ring', x: q.x, y: q.y, t: 0, life: 0.5, color: col },
            { kind: 'ring', x: q.x, y: q.y, t: -0.12, life: 0.6, color: '#ffffff' },
            { kind: 'scan', x: q.x, y: q.y, t: 0, life: 0.8, color: col },
            { kind: 'beam', x: q.x, y: q.y, t: 0, life: 0.7, color: col });
  sparks(q.x, q.y, col, 14 + target.lv * 5, 260 + target.lv * 30);
  S.whiteFlash = Math.max(S.whiteFlash, 0.08 * target.lv);
  S.shake = Math.max(S.shake, 0.08 * target.lv);
  S.glitch = Math.max(S.glitch, 0.05 * target.lv);
  play('twoTone', 0.4);
}
// 기체를 놓는 규칙: 같은 기체면 합체, 빈 자리면 이동, 1칸끼리는 자리 교환
function dropUnit(u, x, y) {
  const k = resAt(x, y);
  if (k >= 0) {
    const r = S.reserve[k];
    if (r === u) return;
    if (r && r.type === u.type && r.lv === u.lv && r.lv < MAX_LV) return doMerge(r, u);
    if (!r) { toReserve(u, k); return; }
    return;
  }
  const c = cellAt(x, y);
  if (c < 0) return;
  const t = S.slots[c];
  if (t && t !== u && t.type === u.type && t.lv === u.lv && t.lv < MAX_LV) return doMerge(t, u);
  const cells = cellsFor(u, c);
  if (canPlace(u, cells)) { place(u, cells); return; }
  if (t && t !== u && t.size === 1 && u.size === 1) {
    if (u.res != null) { const rk = u.res; const tc = t.cells; unplace(t); place(u, tc); toReserve(t, rk); }
    else { const uc = u.cells, tc = t.cells; unplace(t); unplace(u); place(u, tc); place(t, uc); }
    return;
  }
  const q = cellPos(c);
  addText(q.x, q.y - 20, u.size === 2 ? '두 칸이 비어야 해요' : '자리가 없어요', '#ff9a9a', 16, 0.9);
}
function endDrag(ev) {
  if (!drag || ev.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.moved || !S.slots || d.unit.hp <= 0) return;
  const p = toLocal(ev);
  dropUnit(d.unit, p.x, p.y);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ── 루프 ──────────────────────────────────────────────────
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.stage && S.mode !== 'map') update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
function fontsReady() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const want = ['900 20px Orbitron', '700 20px "Chakra Petch"', '20px "Do Hyeon"'].map(f => document.fonts.load(f, 'A가').catch(() => {}));
  return Promise.race([Promise.all(want), new Promise(r => setTimeout(r, 2500))]);
}
Promise.all([loadImages(), fontsReady()]).then(() => { buildTints(); requestAnimationFrame(loop); });
</script>
