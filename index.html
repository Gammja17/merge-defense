let scale = 1;
function resize() {
  const cs = getComputedStyle(document.documentElement);
  const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  scale = Math.min(innerWidth / W, (innerHeight - padY) / H);
  const dpr = Math.min(2, window.devicePixelRatio || 1);   // 3배 폰에서 칠할 픽셀을 절반 아래로
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', resize);
resize();

    im.onload = res; im.onerror = res;
    im.src = 'assets/' + n + (/^(units|enemies)\//.test(n) || /^fx\/ex\d$/.test(n) ? '.webp' : '.png');   // 큰 그림은 WebP

// 기존 스프라이트에 색을 입혀 새 적과 기체 변형을 만든다
function makeTint(src, color, key, amount = 0.5, flip = false) {
  const im = IMG[src];
  if (!im || !im.width) return;
  IMG[key] = offscreen(im.width, im.height, g => {
    if (flip) { g.translate(im.width, im.height); g.rotate(Math.PI); }
    g.drawImage(im, 0, 0);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = amount; g.fillStyle = color; g.fillRect(0, 0, im.width, im.height);
  });
}
// 새 그림 비율에 맞춰 적 크기를 다시 잡는다 (긴 변은 그대로)
function fitEnemySizes() {
  for (const d of Object.values(ENEMY)) {
    const im = IMG[d.img]; if (!im || !im.width) continue;
    const m = Math.max(d.w, d.h) * (d.boss ? 1.12 : 1.08), r = im.width / im.height;
    if (r >= 1) { d.w = m; d.h = m / r; } else { d.h = m; d.w = m * r; }
  }
}
function buildTints() {
  const enemyImgs = [...new Set(Object.values(ENEMY).map(d => d.img).concat(['enemies/rock2']))];

}

function loadSfx() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx(); MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination);
  for (const n of SFX_FILES) fetch('assets/sfx/' + n + '.mp3').then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).then(buf => { BUF[n] = buf; }).catch(() => {});
}
function play(n, vol = 0.4, rate = 1, jitter = 0.06) {
  if (!SET().sfxVol || !AC) return;
  const now = AC.currentTime;
  if (lastPlay[n] && now - lastPlay[n] < (SFX_GAP[n] || 0.02)) return;
  lastPlay[n] = now;
  const name = VARIANTS[n] ? VARIANTS[n][Math.floor(Math.random() * VARIANTS[n].length)] : n;
  const buf = BUF[name];
  if (!buf) return;
  const src = AC.createBufferSource(), g = AC.createGain();
  src.buffer = buf;
  src.playbackRate.value = rate * (1 + (Math.random() - .5) * 2 * jitter);
  g.gain.value = vol * SET().sfxVol * 1.25;
  src.connect(g); g.connect(MASTER); src.start();
}

const MUS = { tracks: {} };
const BOSS_TRACK = { boss1: 'boss1', boss2: 'boss1', boss3: 'boss2', boss4: 'boss3', boss5: 'boss2', boss6: 'boss3' };
function musicTrack(k) {
  if (!MUS.tracks[k]) {
    const a = new Audio('assets/bgm/' + k + '.mp3');
    a.loop = true; a.preload = 'auto';
    const t = { a, vol: 0, g: null };
    // WebAudio로 볼륨을 조절해야 아이폰에서도 페이드가 된다
    try { const src = AC.createMediaElementSource(a); t.g = AC.createGain(); t.g.gain.value = 0; src.connect(t.g); t.g.connect(AC.destination); } catch (e) {}
    MUS.tracks[k] = t;
  }
  return MUS.tracks[k];
}
function wantedMusic() {
  const st = S.stage;
  if (!st) return 'menu';
  if (S.warning > 0 || (S.boss && !S.boss.dead)) return BOSS_TRACK[st.sector.boss] || 'boss1';
  if (st.endless) return 'endless';
  return st.s <= 1 ? 'battle1' : 'battle2';
}
function updateMusic(dt) {
  if (!AC) return;
  const want = SET().bgmVol > 0 ? wantedMusic() : null;
  const duck = S.paused || UI.settings || UI.card || UI.shop || S.mode === 'win' || S.mode === 'lose' ? 0.4 : 1;
  if (want) musicTrack(want);
  for (const k in MUS.tracks) {
    const t = MUS.tracks[k], target = k === want ? 0.6 * SET().bgmVol * duck : 0;
    t.vol += (target - t.vol) * Math.min(1, dt * 1.6);
    if (target > 0 && t.a.paused) { if (t.vol < 0.02 && k.startsWith('boss')) t.a.currentTime = 0; t.a.play().catch(() => {}); }
    if (target === 0 && t.vol < 0.01 && !t.a.paused) t.a.pause();
    if (t.g) t.g.gain.value = t.vol; else t.a.volume = Math.max(0, Math.min(1, t.vol));
  }
}
function spr(name, x, y, w, h, rot = 0, alpha = 1) {
  const im = IMG[name];
  if (!im || !im.width) return;
  if (w == null) { w = im.width; h = im.height; }
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(name.startsWith('enemies/') ? fitImg(im, w, h) : im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

const unitMaxHp = (type, lv) => Math.round(UNIT[type].hp * (1 + 0.3 * (lv - 1))) + Math.floor(mkOf(type) / 3) + (S && S.pk ? S.pk.hp : 0);
// 레벨별 대표 수치: 공격 기체는 DPS(초당 피해, 단일 대상 기준), 지원 기체는 핵심 효과
function levelStat(type, lv) {
  const d = UNIT[type], m = LV_MUL[lv - 1];
  switch (type) {
    case 'g': return { v: Math.round(unitMaxHp(type, lv) * 12 * mkMul(type)), label: '전투력' };
    case 'm': return { v: Math.round([120, 220, 320, 420, 560][lvIdx(lv)] * mkMul(type) * Math.pow(1.4, Math.max(0, lv - 5))), label: '전투력' };
    case 'x': return { v: Math.round([150, 260, 420, 560, 800][lvIdx(lv)] * mkMul(type) * Math.pow(1.4, Math.max(0, lv - 5))), label: '전투력' };
    case 'k': return { v: Math.round([150, 220, 380, 480, 640][lvIdx(lv)] * mkMul(type) * Math.pow(1.4, Math.max(0, lv - 5))), label: '전투력' };
  }
  let dps;
  if (type === 'h') dps = d.dmg * m * (lv >= 5 ? 2 : 1);
  else if (type === 'e') dps = d.dmg * m / d.cd * [2, 3, 3, 5, 5][lvIdx(lv)];
  else if (type === 'd') dps = d.dmg * m * [1, 0.8, 0.6, 0.6, 0.5][lvIdx(lv)] * [1, 2, 4, 4, 8][lvIdx(lv)] / 0.45;
  else if (type === 'a') dps = d.dmg * m * [3, 5, 5, 6, 7][lvIdx(lv)] / d.cd;
  else if (type === 'n') dps = d.dmg * m * [1, 2, 2, 2, 3][lvIdx(lv)] / [2.5, 2.5, 2.2, 2, 1.8][lvIdx(lv)];
  else if (type === 's') dps = d.dmg * m * (lv >= 2 ? 1.45 : 1) / d.cd;
  else dps = d.dmg * m / d.cd;
  return { v: Math.round(dps * mkMul(type) * 10), label: '전투력' };
}

}

function drawParts() {

  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';

}

function drawShots() {
  for (const s of S.shots) {
    const a = Math.atan2(s.vy, s.vx) + Math.PI / 2;
    const sp = Math.hypot(s.vx, s.vy) || 1, ux = s.vx / sp, uy = s.vy / sp;

      const tg = ctx.createLinearGradient(s.x - ux * tl, s.y - uy * tl, s.x, s.y);

        drawGlow(s.col, s.x, s.y, 26, 0.8);
        break;
      case 's':

        ctx.fillStyle = '#e8ffff'; hexPath(s.x, s.y, 4); ctx.fill();
        break;

        ctx.strokeStyle = '#d8b0ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x, s.y, r, S.time * 10, S.time * 10 + 4); ctx.stroke();

        break;
      case 'bomb': drawGlow('#ffcf5a', s.x, s.y, 12, 0.8); spr('bomblet', s.x, s.y, 12, 17, a); break;
      case 'b':

}
function drawDrones() {

// ── 화면 ──────────────────────────────────────────────────
function draw(dt) {
  BUTTONS = [];

  if (S.punch > 0 && SET().shake) { const z = 1 + S.punch * 0.035; ctx.translate(W / 2, 520); ctx.scale(z, z); ctx.translate(-W / 2, -520); }
  drawBg(dt, S.stage ? S.stage.s : 0);

    ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#ffd966'; ctx.fillText('OR', mx, y + 1);
  }

  for (const e of S.enemies) drawEnemy(e);
  drawStrikes();

  ctx.drawImage(DECK, 0, LINE_Y - 10);
  drawShield();
  drawBaseLive();
  drawPads();
  drawAttacks();
  for (const u of gridUnits()) { const p = unitPos(u); drawUnit(u, p.x, p.y, drag && drag.unit === u && drag.moved ? 0.3 : 1, 1, true); }
  for (const u of gridUnits()) if (u.ice > 0) {
    const b = unitBox(u), a = Math.min(1, u.ice * 2);
    ctx.fillStyle = `rgba(170,235,255,${0.35 * a})`; chamfer(b.x, b.y, b.w, b.h, 9); ctx.fill();
    ctx.strokeStyle = `rgba(220,250,255,${0.9 * a})`; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = FU(11); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; outlineText(u.ice.toFixed(1), b.x + b.w / 2, b.y + 12, '#e8fbff', 3);
  }
  drawUnitFrames(true);
  S.reserve.forEach((u, k) => { if (!u) return; const p = resPos(k); drawUnit(u, p.x, p.y, drag && drag.unit === u && drag.moved ? 0.3 : 0.85, uSize(u) > 2 ? 0.34 : uSize(u) === 2 ? 0.45 : 0.8); });
  drawDrones();
  drawBeams();
  drawShots();
  drawParts();
  drawFx();
  if (drag && drag.moved) {
    const du = drag.unit, c = cellAt(drag.x, drag.y);
    if (c >= 0) {
      const cells = cellsFor(du, c), ok = canPlace(du, cells);
      for (const cc of cells) { const q = cellPos(cc); ctx.strokeStyle = ok ? 'rgba(120,230,255,.8)' : 'rgba(255,90,90,.6)'; ctx.lineWidth = 2; chamfer(q.x - CW / 2 + 4, q.y - CH / 2 + 4, CW - 8, CH - 8, 9); ctx.stroke(); }
    }
    { // 합체 후보 강조
      const canM = tu => tu && tu !== du && tu.type === du.type && tu.lv === du.lv && du.lv < MAX_LV;
      const pulse = 0.5 + 0.5 * Math.sin(S.time * 10);
      for (const tu of allUnits()) {

        if (tu.res != null) { const q = resPos(tu.res); bx = q.x - 26; by = q.y - 32; bw = 52; bh = 64; }
        else { const xs = tu.cells.map(cc => cellPos(cc).x), ys = tu.cells.map(cc => cellPos(cc).y); bx = Math.min(...xs) - CW / 2 + 2; by = Math.min(...ys) - CH / 2 + 2; bw = Math.max(...xs) - Math.min(...xs) + CW - 4; bh = Math.max(...ys) - Math.min(...ys) + CH - 4; }
        if (tu === du) continue;
        if (!canM(tu)) { ctx.fillStyle = 'rgba(2,4,12,.55)'; chamfer(bx, by, bw, bh, 9); ctx.fill(); continue; }
        drawGlow('#8dff9a', bx + bw / 2, by + bh / 2, Math.max(bw, bh) * 0.8, 0.35 + 0.3 * pulse);

      const hg = ctx.createLinearGradient(0, zt, 0, SCRAP_Y);

      ctx.strokeStyle = hot ? '#ffb0a0' : '#ff5a4a'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = FK(18); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = hot ? '#fff' : '#ffb8a8';
      ctx.fillText('▲ 해체 ▲', W / 2, by + 9);

      if (hot) { ctx.font = FK(24); outlineText(`부품 +${SCRAP_GEAR[du.lv - 1] * uSize(du)}`, lx, SCRAP_Y - 72, '#ffd6a0', 5); }
    }
    if (drag.y < SCRAP_Y) {
      drawGlow('#ff3a2a', drag.x, drag.y - 20, 80, 0.55 + 0.2 * Math.sin(S.time * 12));

}

// 강화 연출: 코어가 계기에서 기체로 빨려 들어가고, 번쩍, 스캔 링, 육각 파편, "Mk.N 달성!"
function drawUpgradeFx(t2, ax, ay, cx, cy, dt) {
  const f = UI.upFx;
  for (const p of UI.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy = p.vy * 0.93 + 200 * dt; }
  UI.parts = UI.parts.filter(p => p.t < p.life);
  if (!f || f.type !== t2) { UI.parts.length = 0; return; }
  const e = performance.now() / 1000 - f.t0;
  if (e > 2) { UI.upFx = null; return; }
  const col = f.max ? `hsl(${(e * 400) % 360},100%,65%)` : f.milestone ? '#ffb347' : '#ffd24a';
  // 1) 코어가 날아든다
  if (e < 0.45) for (let k = 0; k < 8; k++) {
    const q = Math.min(1, Math.max(0, (e - k * 0.03) / 0.35)), ease = q * q;
    if (q <= 0 || q >= 1) continue;
    const mx = (cx + ax) / 2 + (k - 3.5) * 22, my = Math.min(cy, ay) - 60;
    const x = (1 - ease) * (1 - ease) * cx + 2 * (1 - ease) * ease * mx + ease * ease * ax;
    const y = (1 - ease) * (1 - ease) * cy + 2 * (1 - ease) * ease * my + ease * ease * ay;
    drawCore(x, y, 7);
  }
  // 2) 도착 순간 폭발
  if (e >= 0.45 && !f.burst) {
    f.burst = true;
    for (let k = 0; k < (f.milestone || f.max ? 46 : 28); k++) {
      const a = Math.random() * Math.PI * 2, v = 180 + Math.random() * 320;
      UI.parts.push({ x: ax, y: ay, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, life: 0.6 + Math.random() * 0.6, r: 3 + Math.random() * 4, rot: Math.random() * 6 });
    }
  }
  if (e >= 0.45) {
    const q = e - 0.45;
    drawGlow('#ffffff', ax, ay, 90 + q * 120, Math.max(0, 0.9 - q * 1.6));
    drawGlow(f.max ? '#ff6ad8' : col, ax, ay, 130 + q * 200, Math.max(0, 0.6 - q * 0.5));
    ctx.save(); ctx.translate(ax, ay);
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = k === 1 ? '#ffffff' : (f.max ? `hsl(${(e * 400 + k * 120) % 360},100%,65%)` : col);
      ctx.globalAlpha = Math.max(0, 1 - q * 0.9); ctx.lineWidth = 3 - k * 0.7;
      ctx.rotate(e * (k % 2 ? -4 : 5));
      ctx.beginPath(); ctx.arc(0, 0, 50 + q * (140 + k * 40), 0, Math.PI * (1 + k * 0.3)); ctx.stroke();
    }
    ctx.restore();
    // 문구
    const sc = q < 0.2 ? 0.6 + q * 3 : 1.2 - Math.min(0.2, (q - 0.2));
    const a = q > 1.2 ? Math.max(0, 1 - (q - 1.2) * 3) : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, ay + 54 - q * 20); ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = FT(30, 900); glitchText(f.max ? 'RESEARCH COMPLETE' : `MK.${f.mk}`, 0, -14, f.max ? '#ffffff' : col, 6, q < 0.3 ? (0.3 - q) * 30 : 0);
    ctx.font = FK(22); outlineText(f.max ? '연구 완료! 화력 +80%, 체력 +3' : `강화 성공! 화력 +8%${f.milestone ? ', 체력 +1' : ''}`, 0, 20, '#5affc8', 5);
    ctx.restore();
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
