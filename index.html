let scale = 1;
function resize() {
  const cs = getComputedStyle(document.documentElement);
  const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  scale = Math.min(innerWidth / W, (innerHeight - padY) / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', resize);
resize();

// 기존 스프라이트에 색을 입혀 새 적과 기체 변형을 만든다
function makeTint(src, color, key, amount = 0.5, flip = false) {
  const im = IMG[src];
  if (!im || !im.width) return;
  IMG[key] = offscreen(im.width, im.height, g => {
    if (flip) { g.translate(im.width, im.height); g.rotate(Math.PI); }
    g.drawImage(im, 0, 0);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = amount; g.fillStyle = color; g.fillRect(0, 0, im.width, im.height);
  });
}
function buildTints() {
  makeTint('e_grunt', '#ff3cc8', 't_sniper', 0.55);
  makeTint('e_tank', '#ff2a3a', 't_gunship', 0.5);
  makeTint('e_rusher', '#ffa020', 't_bomber', 0.45);
  makeTint('e_tank', '#ffc02a', 't_elite', 0.45);
  makeTint('u_b', '#4ab8ff', 'u_b2', 0.3, true);
  makeTint('u_c', '#6af0ff', 'u_c2', 0.45);
  makeTint('u_v', '#b86bff', 'u_v2', 0.45);
}

  const s = JSON.parse(localStorage.getItem(SAVE_KEY));

} catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(PROG)); } catch (e) {} }
const unlocked = n => n === 1 || (PROG.stars[n - 1] || 0) > 0;

const MK_MAX = 10;
const mkOf = t => (PROG.mk && PROG.mk[t]) || 0;
const mkMul = t => 1 + 0.08 * mkOf(t);
const mkCost = t => Math.round(100 * Math.pow(1.5, mkOf(t)));
const SET = () => PROG.settings;

const SFX = {};
let lastLaserSfx = 0;
function loadSfx() {
  if (SFX.zap) return;
  for (const n of ['laser1','zap','twoTone','shieldDown','shieldUp','lose']) {
    const a = new Audio('assets/sfx/' + n + '.ogg');
    a.preload = 'auto';
    SFX[n] = a;
  }
}
function play(n, vol = 0.4) {
  if (!SET().sfx) return;
  const src = SFX[n];
  if (!src) return;
  const a = src.cloneNode();
  a.volume = vol;
  a.play().catch(() => {});
}
function spr(name, x, y, w, h, rot = 0, alpha = 1) {
  const im = IMG[name];
  if (!im || !im.width) return;
  if (w == null) { w = im.width; h = im.height; }
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

function levelStat(type, lv) {

  }
  let dps;

  else if (type === 'd') dps = d.dmg * m * [1, 0.8, 0.6, 0.6, 0.5][lv - 1] * [1, 2, 4, 4, 8][lv - 1] / 0.45;

function pickWeighted(pool, fresh) {

function rollReward(n, w, avoid) {
  if (Math.random() < 0.1 + 0.02 * Math.floor((n - 1) / 5)) return { heal: 2 };
  const deck = PROG.deck.filter(t => isOwned(t));
  let type, guard = 0;
  do { type = deck[Math.floor(Math.random() * deck.length)]; } while (avoid && type === avoid.type && guard++ < 8);
  const r = Math.random() + 0.035 * (n - 1) + 0.12 * (w - 1);
  let lv = 1, cnt = 1;
  if (UNIT[type].shape !== 1) { lv = 1; cnt = 1; }

  return { type, lv, n: cnt };
}

const twistOf = st => st.twist || TWISTS[(st.n - 1) % TWISTS.length];
function buildWave(st, w) {
  const ev = [];
  const bossWave = st.boss && w === st.waves;
  const twist = w === 4 ? twistOf(st) : null;
  const dur = bossWave ? 50 : w === 5 ? 28 : 22;
  const gap = bossWave ? 3.2 : Math.max(0.75, 1.75 - 0.12 * (w - 1) - 0.05 * st.i - (w === 5 ? 0.2 : 0));
  for (let t = 1; t < dur; t += gap) ev.push({ t, k: 'grunt' });
  let pool = st.sector.pool;
  if (st.n === 1) pool = w <= 3 ? ['tank'] : ['tank', 'rocks'];
  let count = st.n === 1 ? Math.max(0, w - 2) : (bossWave ? 1 + Math.min(st.s, 2) : Math.ceil(w * 0.7) + Math.floor(st.i / 2) + Math.min(st.s, 2));
  if (w === 1) count = Math.min(count, 1);
  for (let k = 0; k < count; k++) {
    let type = pickWeighted(pool, st.sector.fresh);
    if (k === 0 && st.i === 0 && st.sector.fresh.length && w >= 2) type = st.sector.fresh[w % st.sector.fresh.length];
    ev.push({ t: 3 + (k + 0.5) * (dur - 6) / count, k: type });
  }
  if (st.n >= 2 && !bossWave && w >= 2) {
    const atkN = Math.min(3, (w >= 3 ? 1 : 0) + (w >= 5 ? 1 : 0) + (st.i >= 3 ? 1 : 0) + (st.s >= 2 ? 1 : 0) + (st.n === 2 && w === 2 ? 1 : 0));
    for (let k = 0; k < atkN; k++) {
      const pool2 = st.sector.atk;
      const type = k === 0 && st.i === 0 ? pool2[pool2.length - 1] : pool2[Math.floor(Math.random() * pool2.length)];
      ev.push({ t: 4 + (k + 0.3) * (dur - 8) / Math.max(1, atkN), k: type });
    }
  }
  if (twist === 'elite') ev.push({ t: 4, k: 'elite' });
  if (twist === 'ambush') for (let k = 0; k < 4; k++) ev.push({ t: 4 + k * 4.5, k: 'ambush' });
  if (twist === 'meteors') for (let k = 0; k < 3; k++) { ev.push({ t: 5 + k * 5.5, k: 'meteor' }); ev.push({ t: 3 + k * 6, k: 'rocks' }); }
  if (bossWave) ev.push({ t: 1.5, k: st.sector.boss });
  let capT = bossWave ? [6, 14, 24, 32, 40] : w === 5 ? [3, 9, 15, 21, 26] : [3, 9, 15, 21];
  if (twist === 'supply') {
    capT = [2, 5, 8, 11, 14, 17, 20];
    for (let k = 0; k < 2; k++) ev.push({ t: 6 + k * 7, k: st.s >= 3 ? 'thief' : st.s >= 1 ? 'rusher' : 'grunt' });
  }
  capT.forEach((t, k) => {
    const a = rollReward(st.n, Math.min(w, 3));
    ev.push({ t, k: 'cap', r: k % 2 ? [a, rollReward(st.n, Math.min(w, 3), a)] : a });
  });
  return ev.sort((a, b) => a.t - b.t);
}

function buildEndlessWave(w) {

  const wi = (w - 1) % 5 + 1, bossW = w % 10 === 0, bs = Math.floor(Math.random() * SECTORS.length);

}

    S.parts.push({ kind: 'spark', x, y, vx: (Math.random() - .5) * 40, vy: -40 - Math.random() * 60, t: 0,
                   life: 0.4 + Math.random() * 0.4, size: 1.2 + Math.random() * 1.8, color });
}
function smoke(x, y) {
  if (S.parts.length < 400)
    S.parts.push({ kind: 'smoke', x, y, vx: (Math.random() - .5) * 20, vy: Math.random() * 10 - 5, t: 0, life: 0.5, size: 3 + Math.random() * 3 });
}
function addText(x, y, text, color, size = 22, life = 1.2, num = false) {
  S.texts.push({ x, y, text, color, size, t: 0, life, num });
}
function shake(v) { S.shake = Math.max(S.shake, v); }

// ── 업데이트 ──────────────────────────────────────────────
function steer(s, tx, ty, turn, sp, dt) {
  const want = Math.atan2(ty - s.y, tx - s.x);
  let cur = Math.atan2(s.vy, s.vx);
  let d = want - cur;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const near = Math.hypot(tx - s.x, ty - s.y) < 90;
  cur = near ? want : cur + Math.max(-turn * dt, Math.min(turn * dt, d));
  s.vx = Math.cos(cur) * sp; s.vy = Math.sin(cur) * sp;
}
function distToRay(px, py, x, y, ang) {
  const dx = px - x, dy = py - y, c = Math.cos(ang), s = Math.sin(ang);
  const along = dx * c + dy * s;
  if (along < 0) return 1e9;
  return Math.abs(-dx * s + dy * c);
}

function updateEnemy(e, dt) {
  e.t += dt;
  e.flash = Math.max(0, e.flash - dt);
  e.sflash = Math.max(0, (e.sflash || 0) - dt);
  const d = ENEMY[e.k];
  // 해킹된 적: 멈춰서 주변 적을 쏜다
  if (e.hacked > 0) {
    e.hacked -= dt; e.hackT += dt;
    if (e.hackT >= 0.6) {
      e.hackT = 0;
      let tgt = null, td = 240;
      for (const o of S.enemies) if (o !== e && shootable(o)) { const dd = Math.hypot(o.x - e.x, o.y - e.y); if (dd < td) { td = dd; tgt = o; } }
      if (tgt) {
        const hk = e.hackBy, dmg = UNIT.k.dmg * LV_MUL[(hk ? hk.lv : 1) - 1] * mkMul('k') * S.pk.dmg;
        hitEnemy(tgt, dmg, 'laser');
        S.fx.push({ kind: 'bolt', pts: [{ x: e.x, y: e.y }, { x: tgt.x, y: tgt.y }], t: 0, life: 0.15, col: '#5aff9a' });
      }
    }
    if (e.hacked <= 0) {
      e.hacked = 0;
      if (e.hackBy && e.hackBy.lv >= 3) { const dmg = UNIT.k.dmg * LV_MUL[e.hackBy.lv - 1] * 2; boom(e.x, e.y, 1.3, '#5aff9a'); blast(e.x, e.y, 70, dmg, null); killEnemy(e); }
    }
    return;
  }
  if (e.burnT > 0) { e.burnT -= dt; hitEnemy(e, e.burnD * dt, 'fire', true); if (Math.random() < 0.3) ember(e.x + (Math.random() - .5) * e.r, e.y, '#ff8a2a'); if (e.dead) return; }
  const held = e.stun > 0 || e.frozen > 0;
  e.stun = Math.max(0, e.stun - dt); e.frozen = Math.max(0, e.frozen - dt);
  e.slowT = Math.max(0, e.slowT - dt);
  if (held) return;
  const spd = 1 - (e.slowT > 0 ? e.slow * (e.boss ? 0.5 : 1) : 0);
  e.rot += e.spin * dt;
  if (d.regen && e.shield <= 0) {
    e.downT += dt;
    if (e.downT > d.regen) { e.shield = e.maxShield; S.fx.push({ kind: 'ring', x: e.x, y: e.y, t: 0, life: 0.6, color: '#7fd4ff', r0: e.r, grow: -1 }); addText(e.x, e.y - e.r, '보호막 재생', '#8fe0ff', 20); }
  }
  let hovering = false;
  if (d.atk && !e.boss && e.atkLeft > 0 && e.y >= e.hoverY) {
    hovering = true;
    e.x += Math.sin(e.t * 1.3) * 18 * dt;
    e.atkT -= dt;
    if (e.atkT <= 0 && !S.attacks.some(a => a.src === e)) {
      if (launchAttack(d.atk, e, d.atkDmg)) { e.atkLeft--; e.atkT = d.atkCd; } else e.atkT = 1;
    }
  }
  if (e.boss && d.atk && e.y > 60) {
    e.atkT -= dt;
    if (e.atkT <= 0 && !S.attacks.some(a => a.src === e)) e.atkT = launchAttack(d.atk, e, d.atkDmg) ? d.atkCd : 1;
  }
  switch (e.k) {
    case 'thief': {
      if (e.carry && e.carry.dead) e.carry = null;
      if (e.carry) {
        e.y -= 48 * spd * dt;
        e.carry.x = e.x; e.carry.y = e.y + 46;
        if (e.y < -70) { e.dead = true; e.carry.dead = true; addText(e.x, 120, '캡슐을 도둑맞았어요!', '#ff7070', 22); }
        return;
      }
      let best = null, bd = 1e9;
      for (const c of S.caps) if (!c.carrier && !c.dead && c.y > 0) { const dd = Math.hypot(c.x - e.x, c.y - e.y); if (dd < bd) { bd = dd; best = c; } }
      if (best) {
        const a = Math.atan2(best.y - e.y, best.x - e.x);
        e.x += Math.cos(a) * 115 * spd * dt; e.y += Math.sin(a) * 115 * spd * dt;
        if (bd < 38) { e.carry = best; best.carrier = e; if (S.focus === best) S.focus = null; }
        return;
      }
      break;
    }
    case 'healer': {
      e.skillT += dt;
      if (e.skillT > 1.6) {
        e.skillT = 0;
        let healed = false;
        for (const o of S.enemies) if (o !== e && !o.boss && !o.dead && o.hp < o.maxHp && Math.hypot(o.x - e.x, o.y - e.y) < 150) {
          o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.15); o.heal = 0.4; healed = true;
        }
        S.fx.push({ kind: 'pulse', x: e.x, y: e.y, t: 0, life: 0.7, color: '#6dff8a', r: 150 });
        if (healed) sparks(e.x, e.y, '#8dffa0', 8, 120);
      }
      break;
    }
    case 'boss1':
      e.x = W / 2 + Math.sin(S.time * 0.6) * 60;
      e.spawnT += dt;
      if (e.spawnT > 3.2 && e.y > 40) { e.spawnT = 0; spawnEnemy('minion', e.x - 70, e.y + 40); spawnEnemy('minion', e.x + 70, e.y + 40); }
      break;
    case 'boss2':
      e.x = W / 2 + Math.sin(S.time * 0.4) * 40;
      e.spawnT += dt;
      if (e.spawnT > 4 && e.y > 40) { e.spawnT = 0; for (let i = 0; i < 4; i++) spawnEnemy('rock', e.x + (Math.random() - .5) * 160, e.y + 70); }
      if (e.phase < 3 && e.hp < e.maxHp * (0.75 - e.phase * 0.25)) {
        e.phase++; shake(0.7); boom(e.x, e.y + 60, 1.8, '#ff9a3c');
        for (const vx of [-120, 0, 120]) { const c = spawnEnemy('split', e.x + vx * 0.5, e.y + 60); c.vx = vx * 0.5; }
        addText(e.x, e.y + 100, '핵이 갈라져요!', '#ffb347', 24);
      }
      break;
    case 'boss3':
      e.x = W / 2 + Math.sin(S.time * 0.7) * 80;
      e.spawnT += dt;
      if (e.spawnT > 4 && e.y > 40) { e.spawnT = 0; spawnEnemy('minion', e.x - 80, e.y + 50); spawnEnemy('minion', e.x + 80, e.y + 50); }
      if (e.phase < 1 && e.hp < e.maxHp * 0.5) { e.phase = 1; spawnEnemy('healer', e.x, e.y + 80); }
      break;
    case 'boss4':
      e.x = W / 2 + Math.sin(S.time * 0.5) * 70;
      e.spawnT += dt;
      if (e.spawnT > 4.5 && e.y > 40) { e.spawnT = 0; spawnEnemy('rusher', e.x - 90, e.y + 40); spawnEnemy('rusher', e.x + 90, e.y + 40); }
      if (e.phase < 2 && e.hp < e.maxHp * (0.66 - e.phase * 0.33)) {
        e.phase++; shake(0.7);
        spawnEnemy('thief', e.x - 60, e.y + 60); spawnEnemy('thief', e.x + 60, e.y + 60); spawnEnemy('tank', e.x, e.y + 80);
        addText(e.x, e.y + 110, '증원 함대 출격!', '#ff7a8a', 24);
      }
      break;
  }
  if (!hovering) e.y += (e.boss && e.y < 110 ? e.speed + 45 : e.speed * spd * S.pk.enemySpd) * dt;
  if (e.vx) {
    e.x += e.vx * dt;
    if (e.x < 30 || e.x > W - 30) e.vx = -e.vx;
    e.vx *= Math.pow(0.6, dt);
  }
}

// 기체들의 지속 효과 (레이더 버프, 수리, 방패 재생, 드론)
function updateAuras(dt) {
  const us = gridUnits();
  for (const u of allUnits()) { u.buffSpd = 0; u.buffDmg = 0; }
  S.shatter = us.some(u => u.type === 'c' && u.lv >= 4);
  S.scan = us.some(u => u.type === 'x' && u.lv >= 4);
  const global = us.some(u => u.type === 'x' && u.lv >= 5);
  for (const r of us) if (r.type === 'x') {
    const L = r.lv, spd = [0.2, 0.2, 0.3, 0.3, 0.4][L - 1], dmg = [0, 0.15, 0.25, 0.25, 0.35][L - 1];
    for (const o of neighborsOf(r)) { o.buffSpd = Math.max(o.buffSpd, spd); o.buffDmg = Math.max(o.buffDmg, dmg); }
  }
  if (global) for (const u of us) { u.buffSpd += 0.15; u.buffDmg += 0.15; }
  for (const u of us) {
    u.t1 += dt; u.t2 = Math.max(0, u.t2 - dt); u.t3 = Math.max(0, u.t3 - dt);
    if (u.type === 'g' && u.lv >= 2 && u.t1 >= 4) { u.t1 = 0; if (u.hp < u.maxHp) { u.hp++; const p = unitPos(u); addText(p.x, p.y - 26, '+1', '#6ad0ff', 14, 0.6, true); } }
    if (u.type === 'm') {
      if (u.t1 >= 3) {
        u.t1 = 0;
        const targets = new Set();
        let worst = null, wr = 1;
        for (const o of us) if (o.hp < o.maxHp && o.hp / o.maxHp < wr) { wr = o.hp / o.maxHp; worst = o; }
        if (worst) targets.add(worst);
        if (u.lv >= 2) for (const o of neighborsOf(u)) if (o.hp < o.maxHp) targets.add(o);
        const p = unitPos(u);
        for (const o of targets) { o.hp = Math.min(o.maxHp, o.hp + 1); const q = unitPos(o); S.fx.push({ kind: 'bolt', pts: [p, q], t: 0, life: 0.3, col: '#6dff8a' }); addText(q.x, q.y - 26, '+1', '#6dff8a', 14, 0.6, true); }
      }
      if (u.lv >= 3) { u.baseT = (u.baseT || 0) + dt; if (u.baseT >= 15) { u.baseT = 0; if (S.hp < S.maxHp) { S.hp++; addText(W / 2, LINE_Y - 30, '기지 수리 +1', '#6dff8a', 18); } } }
    }
    if (u.type === 'd') updateDrones(u, dt);
  }
  S.baseGuardT = Math.max(0, S.baseGuardT - dt);
  for (const rb of S.rebuilds) {
    rb.t -= dt;
    if (rb.t <= 0 && !rb.done) { rb.done = true; if (giveUnit(rb.type, 1, rb.from.x, rb.from.y, '#6dff8a') !== 'lost') addText(rb.from.x, rb.from.y - 30, '재건 완료', '#6dff8a', 18); }
  }
  S.rebuilds = S.rebuilds.filter(r => !r.done);
}
function updateDrones(u, dt) {
  const n = [1, 2, 4, 4, 8][u.lv - 1], p = unitPos(u);
  while (u.drones.length < n) u.drones.push({ x: p.x, y: p.y, cd: Math.random() * 0.4, a: Math.random() * 6, gone: 0 });
  u.drones.length = n;
  const dmg = UNIT.d.dmg * LV_MUL[u.lv - 1] * [1, 0.8, 0.6, 0.6, 0.5][u.lv - 1] * (1 + u.buffDmg) * (isFront(u) ? 1 + S.pk.front : 1) * mkMul('d') * S.pk.dmg;
  // 적이 가까이 오지 않았을 때만 캡슐을 먼저 노린다
  let capT = null;
  const safe = !S.enemies.some(e => shootable(e) && e.y > 430);
  if (safe) for (const c of S.caps) if (c.y > FIRE_Y && !c.dead && (!capT || c.y > capT.y)) capT = c;
  if (u.lv >= 4) {
    u.kamT = (u.kamT || 0) + dt;
    if (u.kamT >= 5) {
      const tgt = pickHeavy();
      const dr = u.drones.find(d => d.gone <= 0);
      if (tgt && !tgt.maxHits && dr) {
        u.kamT = 0; dr.gone = 2;
        S.fx.push({ kind: 'bolt', pts: [{ x: dr.x, y: dr.y }, { x: tgt.x, y: tgt.y }], t: 0, life: 0.25, col: '#ff6a5a' });
        boom(tgt.x, tgt.y, 1.2, '#ff6a5a'); blast(tgt.x, tgt.y, 60, dmg * 8, tgt);
      }
    }
  }
  u.drones.forEach((d, i) => {
    if (d.gone > 0) { d.gone -= dt; d.x = p.x; d.y = p.y; return; }
    const tgt = capT || pickTarget();
    d.a += dt * 3;
    const ox = Math.cos(d.a + i * 1.3) * 46, oy = Math.sin(d.a + i * 1.3) * 22 + 70;
    const tx = tgt ? tgt.x + ox : p.x + Math.cos(d.a + i) * 30, ty = tgt ? tgt.y + oy : p.y - 40 + Math.sin(d.a + i) * 10;
    const dx = tx - d.x, dy = ty - d.y, dist = Math.hypot(dx, dy), sp = 320;
    if (dist > 2) { d.x += dx / dist * Math.min(dist, sp * dt); d.y += dy / dist * Math.min(dist, sp * dt); }
    d.cd -= dt * (1 + u.buffSpd);
    if (tgt && d.cd <= 0 && Math.hypot(tgt.x - d.x, tgt.y - d.y) < 150) {
      d.cd = 0.45;
      if (tgt.maxHits) hitCap(tgt); else hitEnemy(tgt, dmg, 'laser', true);
      S.fx.push({ kind: 'bolt', pts: [{ x: d.x, y: d.y }, { x: tgt.x, y: tgt.y }], t: 0, life: 0.1, col: '#ff8a7a' });
    }
  });
}

function update(dt) {
  S.time += dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 2);
  S.glitch = Math.max(0, S.glitch - dt);

  if (S.hint) { S.hintT -= dt; if (S.hintT <= 0) S.hint = null; }
  if (!S.hint && S.hintQueue.length) { S.hint = S.hintQueue.shift(); S.hintT = 5.5; }

  for (const t of S.texts) t.t += dt;
  S.texts = S.texts.filter(t => t.t < t.life);
  for (const f of S.fx) f.t += dt;
  S.fx = S.fx.filter(f => f.t < f.life);
  const damp = Math.pow(0.9, dt * 60);
  for (const p of S.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind !== 'flame') { p.vx *= damp; p.vy *= damp; } }
  S.parts = S.parts.filter(p => p.t < p.life);
  for (const h of S.shieldHits) h.t += dt;
  S.shieldHits = S.shieldHits.filter(h => h.t < 0.8);
  if (S.banner) { S.banner.t += dt; if (S.banner.t > S.banner.life) S.banner = null; }
  if (S.skillPop) { S.skillPop.t += dt; if (S.skillPop.t > S.skillPop.life) S.skillPop = null; }
  S.warning = Math.max(0, S.warning - dt);
  S.whiteFlash = Math.max(0, S.whiteFlash - dt * 1.5);

  if (S.mode === 'win' || S.mode === 'lose' || S.mode === 'perk') return;

  if (S.mode === 'break') {
    S.breakT -= dt;
    if (S.breakT <= 0) startWave(S.wave + 1);
  } else if (S.mode === 'play') {
    S.waveT += dt;
    while (S.events.length && S.events[0].t <= S.waveT) runEvent(S.events.shift());
  }

  for (const e of S.enemies) {
    if (e.dead) continue;
    updateEnemy(e, dt);
    if (e.heal) e.heal = Math.max(0, e.heal - dt);
    if (!e.dead && e.y + (e.boss ? e.h * 0.35 : 0) >= LINE_Y) {
      e.dead = true;
      if (e.carry) e.carry.carrier = null;
      const guard = !e.boss && S.baseGuardT <= 0 && gridUnits().some(u => u.type === 'g' && u.lv >= 5);
      if (guard) {
        S.baseGuardT = 12;
        boom(e.x, LINE_Y, 1.2, '#6ad0ff');
        addText(e.x, LINE_Y - 30, '방어선 보호막!', '#6ad0ff', 22);
        S.shieldHits.push({ x: e.x, t: 0 });
        continue;
      }
      if (e.boss) S.hp = 0;
      else S.hp -= ENEMY[e.k].dmg;
      shake(0.5);
      S.shieldHits.push({ x: e.x, t: 0 });
      boom(e.x, LINE_Y, 1.2, '#ff5050');
      addText(e.x, LINE_Y - 30, `-${e.boss ? 'ALL' : ENEMY[e.k].dmg}`, '#ff6060', 26);
      play('shieldDown', 0.4);
    }
  }
  for (const a of S.attacks) {
    if (a.cancelled) continue;
    // 공격자가 멈춰 있으면 조준도 멈춘다
    if (a.src && (a.src.stun > 0 || a.src.frozen > 0)) continue;
    a.t += dt;
    if (a.t >= a.warn) { a.done = true; resolveAttack(a); }
  }
  S.attacks = S.attacks.filter(a => !a.done && !a.cancelled);

  for (const c of S.caps) {
    c.flash = Math.max(0, (c.flash || 0) - dt);
    if (c.carrier && !c.carrier.dead) continue;
    c.carrier = null;
    c.y += c.speed * dt;
    if (c.y > LINE_Y + 10 && !c.dead) {
      c.dead = true;
      addText(c.x, LINE_Y - 20, '놓침', '#aaa', 20);
      if (c.pair && !c.pair.dead) c.pair.dead = true;
    }
  }

  updateAuras(dt);
  for (const u of allUnits()) {
    u.pop = Math.max(0, u.pop - dt);
    u.kick = Math.max(0, (u.kick || 0) - dt);
    u.flash = Math.max(0, (u.flash || 0) - dt);
    u.hurt = Math.max(0, u.hurt - dt);
    if (u.res != null) continue;
    if (u.hp < u.maxHp * 0.5 && Math.random() < 0.08) { const p = unitPos(u); smoke(p.x + (Math.random() - .5) * 20, p.y - 10); }
    if (drag && drag.unit === u) continue;
    u.cd -= dt * (1 + u.buffSpd) * S.pk.spd;
    if (u.cd <= 0) {
      const cd = u.type === 'k' ? [7, 6, 5, 4.5, 4][u.lv - 1] : u.type === 'n' ? [2.5, 2.5, 2.2, 2, 1.8][u.lv - 1] : UNIT[u.type].cd;
      u.cd = fireUnit(u) ? cd : Math.min(0.1, cd);
    }
    if (u.lv >= 5 && SKILL_CD[u.type]) {
      u.sk -= dt;
      if (u.sk <= 0) u.sk = unitSkill(u) ? SKILL_CD[u.type] : 0.3;
    }
  }

  for (const s of S.shots) {
    if (s.type === 'p') {
      s.x += s.vx * dt; s.y += s.vy * dt;
      for (const e of S.enemies) if (shootable(e) && !s.hitSet.has(e) && Math.hypot(e.x - s.x, e.y - s.y) < e.r + 8) {
        s.hitSet.add(e);
        hitEnemy(e, s.dmg, 'laser', !s.crit);
        if (s.crit) addText(e.x, e.y - e.r, 'CRIT', '#ffd24a', 14, 0.6, true);
        if (s.exec && !e.dead && !e.boss && e.hp < e.maxHp * 0.25) { killEnemy(e); addText(e.x, e.y - e.r, '처형', '#7dff7a', 16, 0.8); }
        S.fx.push({ kind: 'hit', x: s.x, y: s.y, t: 0, life: 0.18, color: s.col });
        sparks(s.x, s.y, s.col, 4, 200);
      }
      for (const c of S.caps) if (!c.dead && !s.hitSet.has(c) && Math.hypot(c.x - s.x, c.y - s.y) < c.r + 6) { s.hitSet.add(c); hitCap(c, 2); }
    } else if (s.type === 'bomb') {
      s.t = (s.t || 0) + dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= Math.pow(0.1, dt); s.vy *= Math.pow(0.1, dt);
      if (Math.random() < 0.5) smoke(s.x, s.y);
      if (s.t > s.life) { s.done = true; boom(s.x, s.y, 0.55, '#ffcf5a'); blast(s.x, s.y, 48, s.dmg, null); }
      continue;
    } else {
      const t = s.tgt;
      if (t && !t.dead) steer(s, t.x, t.y, s.turn, s.sp, dt);
      if ((s.type === 't' || s.type === 'b' || s.type === 'r') && Math.random() < 0.6) smoke(s.x - s.vx * 0.04, s.y - s.vy * 0.04);
      if (s.type === 'plasma' && Math.random() < 0.8) ember(s.x, s.y, '#7fe8ff');

  const g = ctx.createLinearGradient(0, sy - 60, 0, sy + 60);
  g.addColorStop(0, 'rgba(120,220,255,0)'); g.addColorStop(0.5, 'rgba(120,220,255,.05)'); g.addColorStop(1, 'rgba(120,220,255,0)');
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, sy - 60, W, 120);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,8,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  if (S.glitch > 0) {
    for (let k = 0; k < 5; k++) {
      if (Math.random() > S.glitch * 1.6) continue;
      const y = Math.random() * H, h = 2 + Math.random() * 10;
      ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,40,120,.28)' : 'rgba(40,240,255,.28)';
      ctx.fillRect((Math.random() - .5) * 30, y, W, h);
    }
  }
}

function drawFlame(x, y, len, wid, color, alpha = 1) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha *= alpha;
  const gr = ctx.createLinearGradient(x, y, x, y + len);
  gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(0.3, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.moveTo(x - wid, y);
  ctx.quadraticCurveTo(x - wid * .6, y + len * .5, x, y + len);
  ctx.quadraticCurveTo(x + wid * .6, y + len * .5, x + wid, y);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  drawGlow(color, x, y + len * 0.3, wid * 2.6, 0.45 * alpha);
}

// 기체 그림 (칸 위, 대기함, 격납고 카드 공통)
function drawUnitArt(type, lv, x, y, s, alpha, u) {
  const def = UNIT[type], m = Math.min(lv, 3), t = performance.now() / 1000;
  const ang = u ? u.ang : -Math.PI / 2, kick = u ? (u.kick || 0) : 0, flash = u ? (u.flash || 0) : 0;
  const col = type === 'f' ? LV_COL[lv - 1] : lv >= 5 ? '#ffd24a' : def.col;
  if (type === 'f') {
    const ky = kick * 40, w = [66, 72, 70][m - 1] * s, h = [50, 52, 52][m - 1] * s;
    drawFlame(x, y - 12 + ky + h / 2, (12 + lv * 5) * (0.8 + Math.random() * 0.35) * s, 4 + lv, col, alpha);
    spr('f' + m, x, y - 6 + ky, w, h, 0, alpha);
    if (flash > 0) drawGlow('#ffffff', x, y - 8 - h / 2, 20, flash * 12 * alpha);
    return;
  }
  if (type === 't') {
    spr('tbase', x, y, 62 * s, 62 * s, 0, alpha);
    const bw = [17, 27, 26][m - 1] * 1.4 * s, bh = [38, 41, 41][m - 1] * 1.4 * s;
    ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2);
    const im = IMG['t' + m];
    if (im && im.width) ctx.drawImage(im, -bw / 2, -bh * 0.8 + kick * 60, bw, bh);
    ctx.restore();
    if (lv >= 3) drawGlow(lv >= 5 ? '#ffd24a' : '#ff6a3a', x, y, 16, (0.5 + 0.3 * Math.sin(t * 6)) * alpha);
    if (flash > 0) { const tip = bh * 0.85; drawGlow('#ffc070', x + Math.cos(ang) * tip, y + Math.sin(ang) * tip, 26, flash * 12 * alpha); }
    return;
  }
  const w = def.iw * s, h = def.ih * s, ky = kick * 30;
  if (def.air) {
    if (type === 'b') for (const ox of [-34, 34]) drawFlame(x + ox * s, y + 28 * s + ky, (16 + lv * 4) * (0.8 + Math.random() * 0.3) * s, 6, col, alpha);
    else drawFlame(x, y + h * 0.35 + ky, (12 + lv * 4) * (0.8 + Math.random() * 0.35) * s, 4 + lv, col, alpha);
  }
  if (type === 'r') drawFlame(x, y + h * 0.48, 16 * s * (0.8 + Math.random() * 0.4), 8, col, alpha * 0.8);
  if (type === 'x') {
    // 레이더 스윕
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= alpha * 0.35;
    ctx.translate(x, y); ctx.rotate(t * 2);
    const g = ctx.createLinearGradient(0, 0, 40 * s, 0); g.addColorStop(0, '#48ffd8'); g.addColorStop(1, 'rgba(72,255,216,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 44 * s, -0.4, 0.4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  spr(def.img, x, y - 4 + ky, w, h, def.rot ? ang + Math.PI / 2 : 0, alpha);
  if (lv >= 4) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; spr(def.img, x, y - 4 + ky, w, h, def.rot ? ang + Math.PI / 2 : 0, 0.22 * alpha); ctx.restore(); }
  if (flash > 0) drawGlow(col, x + Math.cos(ang) * h * 0.4, y + Math.sin(ang) * h * 0.4, 20, flash * 10 * alpha);
  if (type === 'e' || type === 'k') drawGlow(col, x, y, 22, (0.3 + 0.2 * Math.sin(t * 9)) * alpha);
}
function drawUnit(u, x, y, alpha = 1, big = 1) {
  const t = performance.now() / 1000;
  const s = (1 + u.pop * 0.8) * big * (1 + (u.lv - 1) * 0.05) * U_SCALE;
  const def = UNIT[u.type], col = u.type === 'f' ? LV_COL[u.lv - 1] : u.lv >= 5 ? '#ffd24a' : def.col;
  const wide = def.shape === 'h2' ? 1.9 : 1, tall = def.shape === 'v2' ? 1.9 : 1;
  drawGlow(col, x, y + 6, (40 + u.lv * 6) * Math.max(wide, tall), (0.16 + 0.06 * Math.sin(t * 2 + x)) * alpha * (0.6 + u.lv * 0.22), 0.55 * tall / wide);
  if (u.lv >= 4) spr(u.lv >= 5 ? 'aura2' : 'aura1', x, y - 4, 92 * s * wide, 90 * s * tall, t * 1.2, 0.5 * alpha);
  if (u.lv >= 5) for (let k = 0; k < 3; k++) {
    const a = t * 2 + k * Math.PI * 2 / 3;
    drawGlow('#ffe27a', x + Math.cos(a) * 34 * s * wide, y - 4 + Math.sin(a) * 30 * s * tall, 7, 0.9 * alpha);
  }
  if (u.type === 'g' && u.cells) {
    // 방패 드론이 지키는 범위
    ctx.save(); ctx.globalAlpha = alpha * (0.15 + 0.08 * Math.sin(t * 3));
    ctx.strokeStyle = '#6ad0ff'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 5]);
    chamfer(x - CW * 1.5 + 4, y - CH * 1.5 + 4, CW * 3 - 8, CH * 3 - 8, 12); ctx.stroke();
    ctx.restore();
  }
  if (u.type === 'a' && u.lv >= 5 && u.cells) {
    ctx.save(); ctx.globalAlpha = alpha * 0.18; ctx.fillStyle = '#d0e8ff';
    ctx.beginPath(); ctx.ellipse(x, y, CW * 1.5, CH * 1.3, 0, Math.PI, 0); ctx.fill(); ctx.restore();
  }
  drawUnitArt(u.type, u.lv, x, y, s, alpha, u);
  if (u.hurt > 0) drawGlow('#ff2a3a', x, y, 40 * wide, u.hurt * 2 * alpha, 0.8);
  const bot = y + (tall > 1 ? CH * 0.95 : 26);
  const pipW = 9, sx = x - (u.lv - 1) * pipW / 2;
  for (let k = 0; k < u.lv; k++) spr('star', sx + k * pipW, bot, 10, 10, 0, alpha);
  if (u.maxHp) {
    const bw = wide > 1 ? 110 : 48, bx = x - bw / 2, by = bot + 7, r = Math.max(0, u.hp / u.maxHp);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 5);
    ctx.fillStyle = r > 0.5 ? '#5fd8ff' : r > 0.25 ? '#ffc04a' : '#ff4a5a'; ctx.fillRect(bx, by, bw * r, 3);
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    for (let k = 1; k < u.maxHp; k++) ctx.fillRect(bx + bw * k / u.maxHp, by, 1, 3);
    ctx.globalAlpha = 1;
  }
  if (u.buffSpd > 0 && u.cells) drawGlow('#48ffd8', x + 22, y - 26, 6, 0.8);
}

function drawCap(c) {
  const rw = c.rw, look = capLook(rw), col = look.col;
  const x = c.x, y = c.y + (c.carrier ? 0 : Math.sin(S.time * 3 + c.bob) * 3);
  const s = c.flash > 0 ? 1.12 : 1;
  drawGlow(col, x, y, 64, 0.32 + 0.14 * Math.sin(S.time * 4 + c.bob));
  if (S.focus === c) {
    drawGlow('#ff3040', x, y, 76, 0.28);
    ctx.save(); ctx.translate(x, y); ctx.rotate(S.time * 1.6);
    brackets(-52, -52, 104, 104, 16, '#ff4d5a', 3);
    ctx.restore();
  }
  const ratio = Math.max(0, c.hits / c.maxHits);
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(x, y, 41, 0, Math.PI * 2); ctx.stroke();
  const segs = 24, on = Math.ceil(segs * ratio);
  ctx.strokeStyle = col;
  for (let k = 0; k < on; k++) {
    const a0 = -Math.PI / 2 + k * Math.PI * 2 / segs;
    ctx.beginPath(); ctx.arc(x, y, 41, a0 + 0.03, a0 + Math.PI * 2 / segs - 0.03); ctx.stroke();
  }
  spr(look.cap, x, y, 58 * s, 56 * s);
  if (!rw.heal) {
    const def = UNIT[rw.type], k = Math.min(40 / def.iw, 40 / def.ih);
    drawUnitArt(rw.type, rw.lv, x, y + 2, k, 1, null);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = /[가-힣]/.test(look.label) ? FK(22) : FT(19, 900);
  outlineText(look.label, x, y - 58, '#fff');
  if (!rw.heal) { ctx.font = FK(13); outlineText(UNIT[rw.type].name, x, y - 76, col, 3); }
  ctx.fillStyle = 'rgba(4,8,22,.92)'; chamfer(x - 22, y + 31, 44, 20, 5); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.font = FT(12, 900); ctx.fillStyle = '#fff';
  ctx.fillText(String(Math.max(0, c.hits)), x, y + 42);
}

function drawEnemy(e) {
  if (e.carry) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createLinearGradient(e.x, e.y, e.carry.x, e.carry.y);
    gr.addColorStop(0, 'rgba(255,80,90,.7)'); gr.addColorStop(1, 'rgba(255,80,90,.1)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.moveTo(e.x - 10, e.y + 10); ctx.lineTo(e.x + 10, e.y + 10);
    ctx.lineTo(e.carry.x + 34, e.carry.y); ctx.lineTo(e.carry.x - 34, e.carry.y); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if (e.k === 'healer') drawGlow('#6dff8a', e.x, e.y, 60, 0.25 + 0.1 * Math.sin(S.time * 5));
  if (e.k === 'thief') drawGlow('#ff4a5a', e.x, e.y, 50, 0.3);
  const charging = S.attacks.some(a => a.src === e);
  if (charging) drawGlow('#ff2a4a', e.x, e.y, e.r * 2.4, 0.35 + 0.3 * Math.sin(S.time * 18));
  if (e.boss) {
    const p = 0.5 + 0.5 * Math.sin(S.time * 4);
    const bc = { boss1: '#ff3a2a', boss2: '#ff8a3a', boss3: '#4ab8ff', boss4: '#ff3a5a' }[e.k];
    drawGlow(bc, e.x, e.y - 20, 160, 0.22 + 0.1 * p);
    if (e.k === 'boss1' || e.k === 'boss4') for (const ox of [-58, 58]) drawGlow('#ff6a3a', e.x + ox, e.y - e.h * 0.45, 26, 0.6 + 0.3 * p, 1.4);
  } else if (ENGINE_COL[e.k] && !(e.frozen > 0) && !(e.hacked > 0)) {
    drawGlow(ENGINE_COL[e.k], e.x, e.y - e.h / 2 + 6, 14 + e.w * 0.12, 0.5 + 0.25 * Math.sin(S.time * 20 + e.x), 1.3);
  }
  spr(e.img, e.x, e.y, e.w, e.h, e.rot, 1);
  if (e.flash > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; spr(e.img, e.x, e.y, e.w, e.h, e.rot, 0.7); ctx.restore(); }
  if (e.heal > 0) drawGlow('#6dff8a', e.x, e.y, e.r * 1.4, e.heal * 1.5);
  // 상태 이상
  if (e.frozen > 0) {
    drawGlow('#9ff0ff', e.x, e.y, e.r * 1.5, 0.55);
    ctx.strokeStyle = 'rgba(200,250,255,.8)'; ctx.lineWidth = 2; hexPath(e.x, e.y, e.r * 1.05); ctx.stroke();
  } else if (e.slowT > 0) drawGlow('#6ab8ff', e.x, e.y, e.r * 1.1, 0.25);
  if (e.stun > 0) for (let k = 0; k < 3; k++) { const a = S.time * 8 + k * 2.1; drawGlow('#ffe24a', e.x + Math.cos(a) * e.r * 0.8, e.y - e.r * 0.6 + Math.sin(a) * 6, 5, 0.9); }
  if (e.burnT > 0) drawGlow('#ff6a2a', e.x, e.y, e.r * 1.1, 0.25 + 0.15 * Math.sin(S.time * 20));
  if (e.hacked > 0) {
    drawGlow('#5aff9a', e.x, e.y, e.r * 1.6, 0.45);
    ctx.font = FU(10); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#5aff9a'; ctx.fillText(`// HACKED ${e.hacked.toFixed(1)}`, e.x, e.y + e.h / 2 + 10);
  }
  if (e.shield > 0) {
    if (!HEX_PAT) HEX_PAT = ctx.createPattern(HEX, 'repeat');
    const r = e.shield / e.maxShield, rad = e.r * 1.35 + 6;
    drawGlow('#4ab8ff', e.x, e.y, rad * 1.1, 0.18 + 0.2 * r + (e.sflash > 0 ? 0.45 : 0));
    ctx.save();
    ctx.beginPath(); ctx.arc(e.x, e.y, rad, 0, Math.PI * 2); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.12 + 0.2 * r + (e.sflash > 0 ? 0.35 : 0);
    ctx.translate(e.x, e.y + S.time * 10);
    ctx.fillStyle = HEX_PAT; ctx.fillRect(-rad, -rad - S.time * 10, rad * 2, rad * 2);
    ctx.restore();
    ctx.strokeStyle = `rgba(140,220,255,${0.3 + 0.4 * r})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, rad, 0, Math.PI * 2); ctx.stroke();
  }
  const focused = S.focus === e;
  if (focused || e.pending > 0) {
    const bs = e.r * (focused ? 1.5 : 1.25) + Math.sin(S.time * 10) * 2;
    brackets(e.x - bs, e.y - bs, bs * 2, bs * 2, bs * 0.4, focused ? '#ff4d5a' : 'rgba(120,230,255,.55)', focused ? 3 : 1.5);
  }
  if (!e.boss && (e.hp < e.maxHp || e.shield < e.maxShield)) {
    const bw = e.w * 0.8, bx = e.x - bw / 2, by = e.y - e.h / 2 - 12;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    ctx.fillStyle = '#ff5a5a'; ctx.fillRect(bx, by, bw * Math.max(0, e.hp / e.maxHp), 4);
    if (e.maxShield) { ctx.fillStyle = '#6ad0ff'; ctx.fillRect(bx, by - 4, bw * Math.max(0, e.shield / e.maxShield), 2); }
  }
  if (ENEMY[e.k].atk && !e.boss && !(e.hacked > 0)) {
    ctx.font = FU(10); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = charging ? '#ff6a7a' : 'rgba(255,150,200,.7)';
    ctx.fillText(charging ? '▲ LOCK' : ENEMY[e.k].name, e.x, e.y + e.h / 2 + 10);
  }
}

function drawAttacks() {
  for (const a of S.attacks) {
    const p = Math.min(1, a.t / a.warn), pulse = 0.5 + 0.5 * Math.sin(S.time * (10 + p * 20));
    const m = cellsCenter(a.cells);
    if (a.src) {
      ctx.strokeStyle = `rgba(255,60,90,${0.3 + 0.4 * p})`; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
      ctx.lineDashOffset = -S.time * 40;
      ctx.beginPath(); ctx.moveTo(a.src.x, a.src.y); ctx.lineTo(m.x, m.y); ctx.stroke(); ctx.setLineDash([]);
    }
    for (const c of a.cells) {
      const q = cellPos(c), x = q.x - CW / 2 + 3, y = q.y - CH / 2 + 3, w = CW - 6, h = CH - 6;
      ctx.fillStyle = `rgba(255,30,60,${0.12 + 0.2 * pulse * (0.5 + p)})`;
      chamfer(x, y, w, h, 8); ctx.fill();
      ctx.save(); chamfer(x, y, w, h, 8); ctx.clip();
      ctx.fillStyle = `rgba(255,60,80,${0.18 + 0.12 * p})`;
      const o = (S.time * 50) % 18;
      for (let sx = x - h + o; sx < x + w; sx += 18) { ctx.beginPath(); ctx.moveTo(sx, y + h); ctx.lineTo(sx + h, y); ctx.lineTo(sx + h + 7, y); ctx.lineTo(sx + 7, y + h); ctx.fill(); }
      ctx.restore();
      ctx.strokeStyle = `rgba(255,80,100,${0.5 + 0.5 * pulse})`; ctx.lineWidth = 2;
      chamfer(x, y, w, h, 8); ctx.stroke();
      ctx.fillStyle = '#ff4a5a'; ctx.fillRect(x + 6, y + h - 7, (w - 12) * (1 - p), 3);
    }
    if (a.kind === 'meteor') {
      ctx.fillStyle = `rgba(0,0,0,${0.25 + 0.35 * p})`;
      ctx.beginPath(); ctx.ellipse(m.x, m.y, 20 + 70 * p, (20 + 70 * p) * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      if (p > 0.6) {
        const k = (p - 0.6) / 0.4, my = m.y - 600 * (1 - k);
        drawFlame(m.x, my - 90, 90, 18, '#ff8a3a');
        spr('e_split', m.x, my, 110, 92, S.time * 3);
        drawGlow('#ffb347', m.x, my, 60, 0.7);
      }
    }
    ctx.font = FU(13); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const top = Math.min(...a.cells.map(c => cellPos(c).y)) - CH / 2 - 8;
    ctx.globalAlpha = 0.6 + 0.4 * pulse;
    outlineText(`⚠ INCOMING ${(a.warn - a.t).toFixed(1)}`, m.x, Math.max(top, LINE_Y + 6), '#ff6a7a', 3);
    ctx.globalAlpha = 1;
  }
}

function drawShield() {
  const t = S.time;
  const gr = ctx.createLinearGradient(0, LINE_Y - 56, 0, LINE_Y - 12);
  gr.addColorStop(0, 'rgba(80,200,255,0)');
  gr.addColorStop(1, `rgba(80,200,255,${0.18 + 0.07 * Math.sin(t * 2)})`);
  ctx.fillStyle = gr; ctx.fillRect(0, LINE_Y - 56, W, 44);
  if (!HEX_PAT) HEX_PAT = ctx.createPattern(HEX, 'repeat');
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.07;
  ctx.fillStyle = HEX_PAT; ctx.fillRect(0, LINE_Y - 44, W, 32);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(130,225,255,.85)'; ctx.fillRect(0, LINE_Y - 13, W, 2);
  ctx.restore();
  const sx = ((t * 180) % (W + 300)) - 150;
  drawGlow('#8fe6ff', sx, LINE_Y - 12, 90, 0.55, 0.14);
  for (const h of S.shieldHits) {
    const p = h.t / 0.8;
    drawGlow('#ff3a3a', h.x, LINE_Y - 18, 40 + 100 * p, (1 - p) * 0.95, 0.4);
  }
}

function drawPads() {
  const t = S.time;
  for (let i = 0; i < COLS * ROWS; i++) {
    const p = cellPos(i), x = p.x - CW / 2 + 4, y = p.y - CH / 2 + 4, w = CW - 8, h = CH - 8;
    const front = i < COLS, u = S.slots[i];
    ctx.fillStyle = front ? 'rgba(40,26,10,.55)' : 'rgba(10,20,44,.6)';
    chamfer(x, y, w, h, 9); ctx.fill();
    ctx.strokeStyle = front ? 'rgba(255,180,70,.35)' : 'rgba(80,200,255,.22)'; ctx.lineWidth = 1.2; ctx.stroke();
    brackets(x + 3, y + 3, w - 6, h - 6, 6, front ? 'rgba(255,190,90,.35)' : 'rgba(120,220,255,.25)', 1);
    if (u) {
      ctx.strokeStyle = UNIT[u.type].col; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5; ctx.setLineDash([4, 6]); ctx.lineDashOffset = -t * 30;
      ctx.beginPath(); ctx.moveTo(x + 10, y + h - 5); ctx.lineTo(x + w - 10, y + h - 5); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    if (front && !u) {
      ctx.font = FU(9); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,190,90,.55)'; ctx.fillText('ATK +15%', p.x, p.y);
    }
    if (drag && drag.moved) {
      const du = drag.unit, tu = S.slots[i];
      if (tu && tu !== du && tu.type === du.type && tu.lv === du.lv && du.lv < MAX_LV) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 12);
        drawGlow('#8dff9a', p.x, p.y, 50, 0.3 + 0.3 * pulse);
        ctx.strokeStyle = `rgba(141,255,154,${0.5 + 0.5 * pulse})`; ctx.lineWidth = 2.5;
        chamfer(x, y, w, h, 9); ctx.stroke();
      }
    }
  }
  const rx = RES_X, ry = GRID_Y + 4, rw = RES_W, rh = CH * ROWS - 8;
  ctx.fillStyle = 'rgba(30,10,40,.55)'; chamfer(rx, ry, rw, rh, 9); ctx.fill();

function drawAtkFx(f, p) {

    g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(0.5, `rgba(255,220,230,${a})`); g.addColorStop(1, 'rgba(255,40,70,0)');
    ctx.fillStyle = g; ctx.fillRect(x - w, y0, w * 2, y1 - y0);
  };
  const beamH = (y, w) => {
    const g = ctx.createLinearGradient(0, y - w, 0, y + w);
    g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(0.5, `rgba(255,220,230,${a})`); g.addColorStop(1, 'rgba(255,40,70,0)');
    ctx.fillStyle = g; ctx.fillRect(0, y - w, W, w * 2);
  };
  if (f.atk === 'snipe' && f.src) {
    const q = cellPos(f.cells[0]);
    ctx.strokeStyle = `rgba(255,90,200,${a})`; ctx.lineWidth = 8 * a + 1;
    ctx.beginPath(); ctx.moveTo(f.src.x, f.src.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(f.src.x, f.src.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  } else if (f.atk === 'column') beamV(cellPos(f.cells[0]).x, f.src ? f.src.y : 0, H, 34 * (1 - p * 0.6));
  else if (f.atk === 'row') beamH(cellPos(f.cells[0]).y, 34 * (1 - p * 0.6));
  else if (f.atk === 'cross') {
    const rows = new Set(f.cells.map(c => Math.floor(c / COLS))), cols = new Set(f.cells.map(c => c % COLS));
    const r = [...rows].find(r => f.cells.filter(c => Math.floor(c / COLS) === r).length === COLS);
    const c = [...cols].find(c => f.cells.filter(x => x % COLS === c).length === ROWS);
    if (r != null) beamH(cellPos(r * COLS).y, 30 * (1 - p * 0.6));
    if (c != null) beamV(cellPos(c).x, f.src ? f.src.y : 0, H, 30 * (1 - p * 0.6));

  const off = (1 - ease(inP)) * -W + ease(outP) * W;

function drawOverlays() {

// ── 입력 ──────────────────────────────────────────────────
let drag = null;
function toLocal(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / scale, y: (ev.clientY - r.top) / scale };
}
function hitButton(p) {
  for (let i = BUTTONS.length - 1; i >= 0; i--) { const b = BUTTONS[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b; }
  return null;
}
function toast(text) { UI.toast = { text, until: performance.now() / 1000 + 1.8 }; }
function goMap() { S = { mode: 'map' }; UI.card = null; }
function doAction(b) {
  const now = performance.now() / 1000;
  switch (b.act) {
    case 'stage':
      if (PROG.deck.length !== DECK_N) { S.toast = { text: '격납고에서 편성 5종을 먼저 채워 주세요', until: now + 1.8 }; return; }
      if (unlocked(b.n)) startStage(b.n); else S.toast = { text: '앞 스테이지를 먼저 깨야 열려요', until: now + 1.6 };
      return;
    case 'next': startStage(S.stage.n + 1); return;
    case 'retry': if (S.stage.endless) startStage(0, true); else startStage(S.stage.n); return;
    case 'map':
      if (S.mode === 'hangar' && PROG.deck.length !== DECK_N) { toast('편성 5종을 채워야 해요'); }
      goMap(); return;
    case 'hangar': S = { mode: 'hangar' }; return;
    case 'card': UI.card = { type: b.type }; return;
    case 'closecard': UI.card = null; return;
    case 'deploy':
      if (PROG.deck.length >= DECK_N) { toast('편성에서 하나를 먼저 빼 주세요'); return; }
      PROG.deck.push(b.type); save(); UI.card = null; return;
    case 'undeploy': PROG.deck = PROG.deck.filter(t => t !== b.type); save(); UI.card = null; return;
    case 'buy': {
      const price = UNIT[b.type].unlock.shop;
      if (PROG.credits < price) { toast('크레딧이 부족해요. 스테이지를 깨서 모으세요'); return; }
      PROG.credits -= price; PROG.owned.push(b.type); save();
      UI.card = { type: b.type, isNew: true };
      return;
    }
    case 'upgrade': {
      const cost = mkCost(b.type);
      if (mkOf(b.type) >= MK_MAX) return;
      if (PROG.credits < cost) { toast('크레딧이 부족해요. 스테이지나 무한 방어선에서 모으세요'); return; }
      PROG.credits -= cost; PROG.mk[b.type] = mkOf(b.type) + 1; save();
      toast(`${UNIT[b.type].name} Mk.${mkOf(b.type)} 완료!`);
      return;
    }
    case 'endless':
      if (!endlessOpen()) return;
      if (PROG.deck.length !== DECK_N) { toast('격납고에서 편성 5종을 먼저 채워 주세요'); return; }
      UI.card = null; startStage(0, true); return;
    case 'records': S = { mode: 'records' }; UI.card = null; return;
    case 'perk': {
      const pk = S.perkChoices[b.i];
      pk.apply(); S.perks.push(pk.id);
      S.perkChoices = null; S.mode = 'break'; S.breakT = 2;
      S.banner = { text: pk.name, sub: pk.desc, color: pk.col, t: 0, life: 1.8 };
      play('shieldUp', 0.4);
      return;
    }
    case 'pause': S.paused = true; return;
    case 'resume': S.paused = false; return;
    case 'settings': UI.settings = true; UI.resetArm = 0; return;
    case 'closesettings': UI.settings = false; return;
    case 'toggle': PROG.settings[b.key] = !PROG.settings[b.key]; save(); return;
    case 'reset':
      if (UI.resetArm > now) { PROG = freshProg(); save(); UI.settings = false; goMap(); return; }
      UI.resetArm = now + 3; return;
  }
}
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const p = toLocal(ev);
  loadSfx();
  if (S.mode === 'title') { goMap(); return; }
  const b = hitButton(p);
  if (UI.settings || UI.card || S.paused || ['map', 'hangar', 'records', 'win', 'lose', 'perk'].includes(S.mode)) { if (b) doAction(b); return; }
  if (b) { doAction(b); return; }
  const c = cellAt(p.x, p.y), k = resAt(p.x, p.y);
  const u = c >= 0 ? S.slots[c] : k >= 0 ? S.reserve[k] : null;
  if (u) {
    if (ev.button === 2) return;
    const d = drag = { unit: u, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false, id: ev.pointerId };
    cv.setPointerCapture(ev.pointerId);
    // 모바일: 꾹 누르고 있으면 정보 카드
    setTimeout(() => { if (drag === d && !d.moved && d.unit.hp > 0) { drag = null; openUnitInfo(d.unit); } }, 450);
    return;
  }
  let best = null, bd = 1e9;
  for (const cp of S.caps) { const d = Math.hypot(cp.x - p.x, cp.y - p.y); if (d < 60 && d < bd) { bd = d; best = cp; } }
  for (const e of S.enemies) { const d = Math.hypot(e.x - p.x, e.y - p.y); if (d < e.r + 22 && d < bd && !(e.hacked > 0)) { bd = d; best = e; } }
  if (best) S.focus = S.focus === best ? null : best;
});
function unitAt(p) {
  if (!S.slots || !['play', 'break'].includes(S.mode)) return null;
  const c = cellAt(p.x, p.y), k = resAt(p.x, p.y);
  return c >= 0 ? S.slots[c] : k >= 0 ? S.reserve[k] : null;
}
function openUnitInfo(u) { UI.card = { type: u.type, inGame: true, u }; }
cv.addEventListener('contextmenu', ev => {
  ev.preventDefault();
  if (UI.card || UI.settings || S.paused) return;
  const u = unitAt(toLocal(ev));
  if (u) { drag = null; openUnitInfo(u); }
});
cv.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  const p = toLocal(ev);
  drag.x = p.x; drag.y = p.y;
  if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 8) drag.moved = true;
});
function doMerge(target, from) {
  mergeInto(target, from);
  const q = unitPos(target), col = LV_COL[target.lv - 1];
  boom(q.x, q.y, 1 + target.lv * 0.15, col);
  S.fx.push({ kind: 'ring', x: q.x, y: q.y, t: 0, life: 0.5, color: col },
            { kind: 'ring', x: q.x, y: q.y, t: -0.12, life: 0.6, color: '#ffffff' },
            { kind: 'scan', x: q.x, y: q.y, t: 0, life: 0.8, color: col },
            { kind: 'beam', x: q.x, y: q.y, t: 0, life: 0.7, color: col });
  sparks(q.x, q.y, col, 14 + target.lv * 5, 260 + target.lv * 30);
  S.whiteFlash = Math.max(S.whiteFlash, 0.08 * target.lv);
  shake(0.08 * target.lv);
  S.glitch = Math.max(S.glitch, 0.05 * target.lv);
  play('twoTone', 0.4);
}
function dropUnit(u, x, y) {
  const k = resAt(x, y);
  if (k >= 0) {
    const r = S.reserve[k];
    if (r === u) return;
    if (r && r.type === u.type && r.lv === u.lv && r.lv < MAX_LV) return doMerge(r, u);
    if (!r) toReserve(u, k);
    return;
  }
  const c = cellAt(x, y);
  if (c < 0) return;
  const t = S.slots[c];
  if (t && t !== u && t.type === u.type && t.lv === u.lv && t.lv < MAX_LV) return doMerge(t, u);
  const cells = cellsFor(u, c);
  if (canPlace(u, cells)) { place(u, cells); return; }
  if (t && t !== u && uSize(t) === 1 && uSize(u) === 1) {
    if (u.res != null) { const rk = u.res, tc = t.cells; unplace(t); place(u, tc); toReserve(t, rk); }
    else { const uc = u.cells, tc = t.cells; unplace(t); unplace(u); place(u, tc); place(t, uc); }
    return;
  }
  const q = cellPos(c);
  addText(q.x, q.y - 20, uSize(u) === 2 ? '두 칸이 비어야 해요' : '자리가 없어요', '#ff9a9a', 16, 0.9);
}
function endDrag(ev) {
  if (!drag || ev.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.moved || !S.slots || d.unit.hp <= 0 || S.paused) return;
  const p = toLocal(ev);
  dropUnit(d.unit, p.x, p.y);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ── 루프 ──────────────────────────────────────────────────
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.stage && !S.paused && !UI.settings && !(UI.card && S.mode !== 'win')) update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
function fontsReady() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const want = ['900 20px Orbitron', '700 20px "Chakra Petch"', '20px "Do Hyeon"'].map(f => document.fonts.load(f, 'A가').catch(() => {}));
  return Promise.race([Promise.all(want), new Promise(r => setTimeout(r, 2500))]);
}
Promise.all([loadImages(), fontsReady()]).then(() => { buildTints(); requestAnimationFrame(loop); });
